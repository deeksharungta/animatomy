.so-steps{display:grid;gap:8px;padding:14px 18px 16px;border-top:1px solid var(--anatomy-faint)}
.so-steps-who{display:inline-flex;align-items:center;gap:6px;font:500 12px/1 var(--anatomy-mono);color:var(--anatomy-muted);min-height:12px}
.so-steps-who i{width:10px;height:10px;border-radius:50%;background:var(--crew-step,var(--anatomy-lo));display:inline-block}
.so-steps-title{margin:0;font:600 19px/1.25 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--anatomy-strong);text-wrap:balance}
.so-steps-text{margin:0;max-width:62ch;color:var(--anatomy-text);font-size:14px;line-height:1.55;min-height:4.65em}
.so-steps-track{display:flex;gap:4px;margin-top:4px}
.so-steps-track i{flex:1;height:3px;border-radius:2px;background:var(--anatomy-faint);overflow:hidden;position:relative}
.so-steps-track i[data-done]{background:var(--anatomy-lo)}
.so-steps-track i[data-now]::after{content:"";position:absolute;inset:0;background:var(--crew-step,var(--anatomy-hi));transform-origin:left;transform:scaleX(var(--so-beat,0))}
.so-steps[data-bare]{position:absolute;top:0;left:0;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.so-steps[data-paused] .so-steps-who::after{content:"paused";margin-left:6px;letter-spacing:.08em;text-transform:uppercase;font-size:10px}
.so-steps p{transition:opacity .25s ease}
.so-steps[data-swap] p{opacity:.35}
@media (prefers-reduced-motion:reduce){.so-steps p{transition:none}}

<span class="so-steps-who" data-steps-who><i></i>Pinch and Ollie</span>
<p class="so-steps-title" data-steps-title aria-live="polite">Meet the crew</p>
<p class="so-steps-text" data-steps-text>A green-sand mould, cut in half, waits under a ladle of steel at 1600 °C. Pinch the crab is the clamp on the box's end; Ollie the otter waits on the riser's sleeve.</p>
<div class="so-steps-track" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
</div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>On duty: whoever is doing the work right now</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>You: the crane, and the handwheel that tips the ladle</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Pinch, crab, holding: the clamp, holding the steel's lift that the cope's weight can't</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Ollie, otter, fluid: the riser's feed, pressing liquid steel down into the shrinking casting</span></span><span class="iso-caption">A teapot ladle pours plain carbon steel (0.25% C: liquidus 1510 °C, solidus 1470 °C) at 1600 °C into a green-sand mould for a flanged sleeve. The basin keeps the 16 mm choke at the sprue's foot running full at about 2.6 kg/s, so 42.7 kg fills the mould in 17.4 s from the bottom up. Pour slower than about 1.3 kg/s and the front cools into its freezing range and stops short; pour faster than the choke's 2.6 kg/s and the basin overflows onto the cope. The cope is shallow, with the cup and an insulating sleeve standing on it, so it weighs only 410 N: the steel's head in the riser pushes it up with 550 N, and the clamp holds the difference, 140 N. The riser has 1.2 times the casting's modulus, so it freezes last; it feeds the 3% the steel shrinks as it freezes (0.17 L) and is left with a 60 mm pipe. Drag the ladle or press ← → to tip it yourself; Space plays on.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");

  const wrap = (angle) => ((angle % TAU) + TAU) % TAU;
  const arc = (s, r, from, to, through) => {
    let sweep = wrap(to - from);
    if (wrap(through - from) > sweep) sweep -= TAU;
    const count = Math.max(4, Math.ceil(Math.abs(sweep) / (TAU / 96)), Math.ceil((Math.abs(sweep) * r * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, index) => iso(pointOf(F, s, r, from + (sweep * index) / count), P));
  };
  const r0 = side[0][1];
  const r1 = side[side.length - 1][1];
  const bottom = -aV > 0 ? facing + Math.PI : facing;
  const top = aV > 0 ? facing + Math.PI : facing;
  const L = left.map((point) => iso(point, P));
  const R = right.map((point) => iso(point, P));
  const topArc = arc(s1, r1, angleOf(left[left.length - 1]), angleOf(right[right.length - 1]), top);
  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);
  const keepFirst = rims === "all" || rims === "first" || rims === "ends";
  const keepLast = rims === "all" || rims === "last" || rims === "ends";
  const fill = pathOf([...L, ...topArc, ...[...R].reverse(), ...bottomArc], true);
  const outline = [pathOf(L), pathOf(R), keepLast ? pathOf(topArc) : "", keepFirst ? pathOf(bottomArc) : ""].join("");
  const hull = hullOf([...arc(s0, r0, 0, TAU - 1e-6, Math.PI), ...arc(s1, r1, 0, TAU - 1e-6, Math.PI), ...L, ...R]);
  let gap = 0;
  for (const p of [...L, ...R]) {
    let best = Infinity;
    for (let index = 0; index < hull.length; index++) {
      const a = hull[index];
      const b = hull[(index + 1) % hull.length];
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));
      best = Math.min(best, Math.hypot(p[0] - a[0] - dx * t, p[1] - a[1] - dy * t));
    }
    gap = Math.max(gap, best);
  }
  return { fill, outline, gap };
}

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const V = viewOf(P);
  const L = lightOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const aL = dot3(F.a, L);
  const uL = dot3(F.u, L);
  const vL = dot3(F.v, L);
  const n = steps;
  const m = meridian.length;
  const rings = meridian.map(([s, r]) => Array.from({ length: n }, (_, j) => iso(pointOf(F, s, r, (j / n) * TAU), P)));
  const midC = [];
  const midS = [];
  for (let j = 0; j < n; j++) {
    const t = ((j + 0.5) / n) * TAU;
    midC.push(Math.cos(t));
    midS.push(Math.sin(t));
  }
  const seen = [];
  const tones = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr);
    const row = [];
    const toneRow = [];
    for (let j = 0; j < n; j++) {
      if (length < 1e-9) {
        row.push(false);
        toneRow.push(0);
        continue;
      }
      const facing = ds * (midC[j] * uV + midS[j] * vV) - dr * aV;
      const lit = (ds * (midC[j] * uL + midS[j] * vL) - dr * aL) / length;
      row.push(facing > 1e-6 * length);
      toneRow.push(bandOf(lit));
    }
    seen.push(row);
    tones.push(toneRow);
  }
  const buckets = [[], [], [], [], []];
  const all = [];
  const smoothed = smooth ? smoothRows(meridian, F, P, { steps, ...(smooth === true ? {} : smooth) }) : null;
  if (smoothed) smoothed.forEach((list, tone) => list.forEach((d) => (buckets[tone].push(d), all.push(d))));
  for (let i = 0; i < m - 1; i++) {
    if (smoothed && Math.abs(meridian[i + 1][0] - meridian[i][0]) > 1e-9) continue;
    const keys = seen[i].map((visible, j) => (visible ? tones[i][j] : null));
    for (const { key, run } of groupsOf(keys)) {
      const a = run.map((j) => rings[i][j]);
      const b = run.map((j) => rings[i + 1][j]).reverse();
      const d = pathOf(oriented([...a, ...b]), true);
      buckets[key].push(d);
      all.push(d);
    }
  }
  const phi = Math.atan2(vV, uV);
  const flatV = Math.hypot(uV, vV);
  const rangeOf = (i) => {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    if (Math.hypot(ds, dr) < 1e-9) return null;
    if (Math.abs(ds) < 1e-9 || flatV < 1e-9) return -dr * aV > 1e-9 ? [-1, 1] : null;
    const c = (dr * aV) / (ds * flatV);
    return ds > 0 ? [Math.max(-1, c), 1] : [-1, Math.min(1, c)];
  };
  const arcsOf = (ranges) => {
    if (ranges.some((range) => !range)) return [];
    const lo = Math.max(...ranges.map(([x]) => x));
    const hi = Math.min(...ranges.map(([, x]) => x));
    if (lo >= hi - 1e-9) return [];
    const near = Math.acos(Math.min(1, hi));
    const far = Math.acos(Math.max(-1, lo));
    if (hi >= 1 && lo <= -1) return [[phi, phi + TAU]];
    if (hi >= 1) return [[phi - far, phi + far]];
    if (lo <= -1) return [[phi + near, phi + TAU - near]];
    return [[phi + near, phi + far], [phi - far, phi - near]];
  };
  const along = (s, r, [from, to]) => {
    const count = Math.max(2, Math.ceil(((to - from) * Math.max(r, 1e-6) * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, j) => iso(pointOf(F, s, r, from + ((to - from) * j) / count), P));
  };
  const creases = [];
  for (let i = 1; i < m - 1; i++) {
    if (meridian[i][2] || meridian[i][1] <= 1e-9) continue;
    for (const arc of arcsOf([rangeOf(i - 1), rangeOf(i)])) creases.push(pathOf(along(meridian[i][0], meridian[i][1], arc)));
  }
  let bevelPath = "";
  if (bevel > 0 && m > 2) {
    const ends = [];
    if (meridian[0][1] <= 1e-9) ends.push([0, 1, 1]);
    if (meridian[m - 1][1] <= 1e-9) ends.push([m - 2, m - 2, m - 3]);
    for (const [cap, rim, side] of ends) {
      const [s, r] = meridian[rim];
      for (const arc of arcsOf([rangeOf(cap), rangeOf(side)])) {
        const inset = along(s, Math.max(0, r - bevel), arc);
        const edge = along(s, r, arc);
        bevelPath += pathOf([edge[0], ...inset.slice(1, -1), edge[edge.length - 1]]);
      }
    }
  }
  const { fill: fillPath, outline } = outlineOf(meridian, F, P, { steps: n, fill, hole, rims, smooth, waist, all });
  return {
    fill: fillPath,
    outline,
    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    bevel: bevelPath || undefined,
    seamless: Boolean(smoothed),
  };
}

function shapeOf(meridian, P, smooth) {
  if (smooth && smooth.radius) {
    const segments = meridian.slice(0, -1).map(([s0], index) => (Math.abs(meridian[index + 1][0] - s0) > 1e-9 ? { radius: smooth.radius, slope: smooth.slope } : null));
    return curved(meridian, P, segments);
  }
  const curves = smooth && !smooth.slope ? curveRuns(meridian) : null;
  return curves && curves.some(Boolean) ? curved(meridian, P, curves) : meridian;
}

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const n = steps;
  let fillPath;
  let outline;
  const shape = shapeOf(meridian, P, smooth);
  const side = fill === "auto" || fill === "surface" ? sideOf(shape) : null;
  const surface = side && !hole ? surfaceOf(side, F, P, rims, { slope: smooth && smooth.slope ? smooth.slope : null }) : null;
  if (surface && (fill === "surface" || surface.gap > waist)) {
    fillPath = surface.fill;
    outline = surface.outline;
  } else if (fill === "hull" || fill === "auto" || fill === "surface") {
    const most = Math.max(...shape.map(([, r]) => r));
    const around = Math.min(320, Math.max(n, Math.ceil((TAU * most * scaleOf(P)) / 1.5)));
    const tagged = [];
    shape.forEach(([s, r], index) => {
      for (let j = 0; j < around; j++) tagged.push({ p: iso(pointOf(F, s, r, (j / around) * TAU), P), ring: index });
    });
    const hull = hullTagged(tagged);
    const holePath = hole ? pathOf(Array.from({ length: around }, (_, j) => iso(pointOf(F, hole[0], hole[1], (j / around) * TAU), P)), true) : "";
    fillPath = pathOf(hull.map(({ p }) => p), true) + holePath;
    if (rims === "all") {
      outline = pathOf(hull.map(({ p }) => p), true) + holePath;
    } else {
      const keepFirst = rims === "first" || rims === "ends";
      const keepLast = rims === "last" || rims === "ends";
      const edges = hull.map((a, index) => {
        const b = hull[(index + 1) % hull.length];
        const same = a.ring === b.ring;
        const keep = !same || (a.ring !== 0 && a.ring !== shape.length - 1) || (keepFirst && a.ring === 0) || (keepLast && a.ring === shape.length - 1);
        return [a.p, b.p, keep];
      });
      outline = chains(edges).map((points) => pathOf(points)).join("") + holePath;
    }
  } else {
    fillPath = all ? all.join("") : (({ shades, top }) => [...shades, top].join(""))(lathe(meridian, F, P, { steps: n, fill: "auto", hole, rims, smooth, waist }));
    outline = "";
  }
  return { fill: fillPath, outline };
}

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];
  return sum + x * ny - nx * y;
}, 0);

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

function saddleOf(F, a, start, s1, P, { steps = stepsFor(a, 24) } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const n = steps;
  const angle = (j) => (j / n) * TAU;
  const from = typeof start === "function" ? start : (t) => saddleStart(start, a, t);
  const low = Array.from({ length: n }, (_, j) => iso(pointOf(F, from(angle(j)), a, angle(j)), P));
  const high = Array.from({ length: n }, (_, j) => iso(pointOf(F, s1, a, angle(j)), P));
  const seen = [];
  const tones = [];
  for (let j = 0; j < n; j++) {
    const normal = radialOf(F, angle(j + 0.5));
    seen.push(dot3(normal, V) > 1e-6);
    tones.push(bandOf(dot3(normal, L)));
  }
  const buckets = [[], [], [], [], []];
  const fills = [];
  const keys = seen.map((visible, j) => (visible ? tones[j] : null));
  for (const { key, run } of groupsOf(keys)) {
    const d = pathOf(oriented([...run.map((j) => low[j]), ...run.map((j) => high[j]).reverse()]), true);
    buckets[key].push(d);
    fills.push(d);
  }
  const capSeen = dot3(F.a, V) > 1e-6;
  if (capSeen) {
    const d = pathOf(oriented(high), true);
    buckets[bandOf(dot3(F.a, L))].push(d);
    fills.push(d);
  }
  const front = runsOf(seen);
  const back = runsOf(seen.map((visible) => !visible));
  const edges = [];
  for (const run of front) {
    edges.push(pathOf(run.map((j) => low[j])));
    edges.push(pathOf([low[run[0]], high[run[0]]]), pathOf([low[run[run.length - 1]], high[run[run.length - 1]]]));
  }
  for (const run of capSeen ? back : front) edges.push(pathOf(run.map((j) => high[j])));
  return {
    fill: fills.join(""),
    outline: edges.join(""),
    crease: capSeen ? front.map((run) => pathOf(run.map((j) => high[j]))).join("") : "",
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    seamless: true,
  };
}

function prismOf(F, polygon, s0, s1, P) {
  const V = viewOf(P);
  const L = lightOf(P);
  const ring = oriented(polygon.map(([x, y]) => [x, y]));
  const n = ring.length;
  const at = (s, [x, y]) => [F.o[0] + F.a[0] * s + F.u[0] * x + F.v[0] * y, F.o[1] + F.a[1] * s + F.u[1] * x + F.v[1] * y, F.o[2] + F.a[2] * s + F.u[2] * x + F.v[2] * y];
  const low = ring.map((point) => iso(at(s0, point), P));
  const high = ring.map((point) => iso(at(s1, point), P));
  const buckets = [[], [], [], [], []];
  const seen = [];
  for (let j = 0; j < n; j++) {
    const [x0, y0] = ring[j];
    const [x1, y1] = ring[(j + 1) % n];
    const normal = unit3(add3(mul3(F.u, y1 - y0), mul3(F.v, -(x1 - x0))));
    const visible = dot3(normal, V) > 1e-6;
    seen.push(visible);
    if (visible) buckets[bandOf(dot3(normal, L))].push(pathOf([low[j], low[(j + 1) % n], high[(j + 1) % n], high[j]], true));
  }
  const ends = [[s0, low, mul3(F.a, -1)], [s1, high, F.a]];
  const capSeen = ends.map(([, , normal]) => dot3(normal, V) > 1e-6);
  ends.forEach(([, points, normal], index) => capSeen[index] && buckets[bandOf(dot3(normal, L))].push(pathOf(points, true)));
  const hull = hullOf([...low, ...high]);
  const creases = [];
  for (let j = 0; j < n; j++) {
    const prev = (j - 1 + n) % n;
    const a = [ring[j][0] - ring[prev][0], ring[j][1] - ring[prev][1]];
    const b = [ring[(j + 1) % n][0] - ring[j][0], ring[(j + 1) % n][1] - ring[j][1]];
    const sharp = (a[0] * b[0] + a[1] * b[1]) / (Math.hypot(a[0], a[1]) * Math.hypot(b[0], b[1]) || 1) < Math.cos(0.35);
    if (sharp && seen[j] && seen[prev]) creases.push(pathOf([low[j], high[j]]));
    ends.forEach(([, points], index) => capSeen[index] && seen[j] && creases.push(pathOf([points[j], points[(j + 1) % n]])));
  }
  return { fill: pathOf(hull, true), outline: pathOf(hull, true), crease: creases.join(""), top: buckets[4].join(""), shades: buckets.slice(0, 4).map((list) => list.join("")) };
}

function stadium(r0, r1, offset, steps = 32) {
  const circle = (cx, r) => Array.from({ length: steps }, (_, index) => [cx + r * Math.cos((index / steps) * TAU), r * Math.sin((index / steps) * TAU)]);
  return hullOf([...circle(0, r0), ...circle(offset, r1)]);
}

function sphereOf(centre, r, P, { steps = 48 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const F = frameAlong(centre, V);
  const flat = (p) => iso(p, P);
  const rim = Array.from({ length: steps }, (_, index) => pointOf(F, 0, r, (index / steps) * TAU));
  const outline = pathOf(rim.map(flat), true);
  const capOf = (threshold) => {
    const points = rim.filter((p) => dot3(sub3(p, centre), L) / r >= threshold).map(flat);
    const c = dot3(L, V);
    const LF = frameAlong(add3(centre, mul3(L, r * threshold)), L);
    const radius = r * Math.sqrt(Math.max(0, 1 - threshold * threshold));
    for (let index = 0; index < steps; index++) {
      const p = pointOf(LF, 0, radius, (index / steps) * TAU);
      if (dot3(sub3(p, centre), V) >= -1e-9) points.push(flat(p));
    }
    if (c > threshold) points.push(flat(add3(centre, mul3(V, r))));
    return points.length > 2 ? pathOf(hullOf(points), true) : "";
  };
  const shades = [outline, capOf(BANDS[1]), capOf(BANDS[2]), capOf(BANDS[3])];
  return { fill: outline, outline, crease: "", top: "", shades, seamless: true };
}

const disc = (s0, s1, r, F, P, options = {}) =>
  lathe(
    [
      [s0, 0],
      [s0, r],
      [s1, r],
      [s1, 0],
    ],
    F,
    P,
    { steps: stepsFor(r, 32, 160, scaleOf(P)), ...options },
  );

const ringBand = (s0, s1, rIn, rOut, F, P, options = {}) =>
  lathe(
    [
      [s0, rIn],
      [s0, rOut],
      [s1, rOut],
      [s1, rIn],
    ],
    F,
    P,
    { steps: stepsFor(rOut, 32, 160, scaleOf(P)), hole: null, ...options },
  );

function solidOf(profile, F, P, options = {}) {
  const first = profile[0];
  const last = profile[profile.length - 1];
  const meridian = [[first[0], 0], ...profile, [last[0], 0]];
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(meridian, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function bandOfProfile(profile, F, P, options = {}) {
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(profile, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function silhouettePoints(profile, F, P, { samples = 72, slope: given = null, radius = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const facing = Math.atan2(vV, uV);
  const flat = Math.hypot(uV, vV) || 1e-9;
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const radiusAt = radius ?? ((s) => {
    let index = 1;
    while (index < profile.length - 1 && profile[index][0] < s) index++;
    const [sa, ra] = profile[index - 1];
    const [sb, rb] = profile[index];
    return ra + ((rb - ra) * (s - sa)) / (sb - sa || 1);
  });
  const side = (sign) => {
    const points = [];
    for (let step = 0; step <= samples; step++) {
      const s = s0 + ((s1 - s0) * step) / samples;
      const h = (s1 - s0) / samples / 2 || 0.01;
      const slope = given ? given(s) : (radiusAt(Math.min(s1, s + h)) - radiusAt(Math.max(s0, s - h))) / (Math.min(s1, s + h) - Math.max(s0, s - h) || 1);
      const c = (slope * aV) / flat;
      if (Math.abs(c) > 1) continue;
      points.push(pointOf(F, s, radiusAt(s), facing + sign * Math.acos(c)));
    }
    return points;
  };
  return [side(1), side(-1)];
}

const silhouetteOf = (profile, F, P, options = {}) =>
  silhouettePoints(profile, F, P, options)
    .map((points) => pathOf(points.map((point) => iso(point, P))))
    .join("");

function profileCurve(profile, { slope = null, radius = null } = {}) {
  for (let index = 1; index < profile.length; index++) if (profile[index][0] - profile[index - 1][0] <= 1e-9) throw new Error(`profileCurve: s must rise along the profile (point ${index} at s = ${profile[index][0]})`);
  const segments = curveRuns(profile);
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const find = (s) => {
    let lo = 0;
    let hi = profile.length - 2;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (profile[mid][0] <= s) lo = mid;
      else hi = mid - 1;
    }
    return lo;
  };
  const linear = (index, s) => {
    const [sa, ra] = profile[index];
    const [sb, rb] = profile[index + 1];
    return [ra + ((rb - ra) * (s - sa)) / (sb - sa), (rb - ra) / (sb - sa)];
  };
  const radiusAt = radius ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].radius(at) : linear(index, at)[0];
  });
  const slopeAt = slope ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].slope(at) : linear(index, at)[1];
  });
  return { s0, s1, radius: radiusAt, slope: slopeAt, analytic: Boolean(slope && radius) };
}

function bandsOf(profile, cuts, F, P, { slope = null, radius = null, steps, rows = 6, rims = "none", fill = "auto", samples = 72 } = {}) {
  const curve = profileCurve(profile, { slope, radius });
  const { s0, s1 } = curve;
  const stops = [s0, ...[...new Set(cuts)].filter((s) => s > s0 + 1e-6 && s < s1 - 1e-6).sort((a, b) => a - b), s1];
  const most = Math.max(...profile.map(([, r]) => r), ...stops.map((s) => curve.radius(s)));
  const n = steps ?? stepsFor(most, 32, 160, scaleOf(P));
  const knot = (s, soft) => (soft ? [s, curve.radius(s), 1] : [s, curve.radius(s)]);
  const meridianOf = (a, b) => [knot(a), ...profile.filter(([s]) => s > a + 1e-9 && s < b - 1e-9).map(([s, , soft]) => knot(s, soft)), knot(b)];
  const shading = { slope: curve.slope, radius: curve.radius, rows };
  const bands = stops.slice(0, -1).map((a, index) => {
    const b = stops[index + 1];
    const meridian = meridianOf(a, b);
    const paths = lathe(meridian, F, P, { steps: n, rims, fill, smooth: shading });
    const seam = index < stops.length - 2 ? arcOf(F, b, curve.radius(b), P, { slope: curve.slope(b) }) : "";

const shd = (d, dx, dy) => d.replace(/(-?[\d.]+),(-?[\d.]+)/g, (_, x, y) => `${+(+x + dx).toFixed(2)},${+(+y + dy).toFixed(2)}`);
// A hind foot pointing left: heel at x = heel, toes at x = -l.
const footPts = (l, w, heel = 2.5) => [[heel, 0.4], [heel * 0.8, -w * 0.8], [-l * 0.3, -w], [-l * 0.78, -w * 0.82], [-l, -w * 0.38], [-l * 0.92, w * 0.18], [-l * 0.3, w * 0.25]];
const toeClaws = (l, w, n, cl) => Array.from({ length: n }, (_, i) => { const y = -w * 0.62 + (w * 0.7 * i) / Math.max(1, n - 1); return `M${-l * 0.96},${y.toFixed(2)}Q${(-l - cl * 0.6).toFixed(2)},${(y - cl * 0.05).toFixed(2)} ${(-l - cl).toFixed(2)},${(y + cl * 0.4).toFixed(2)}`; }).join("");
const toeLines = (l, w) => `M${-l * 0.95},${(-w * 0.5).toFixed(2)}L${(-l * 0.72).toFixed(2)},${(-w * 0.55).toFixed(2)}M${-l * 0.97},${(-w * 0.1).toFixed(2)}L${(-l * 0.72).toFixed(2)},${(-w * 0.2).toFixed(2)}`;
const leg = (hip, l1, l2, w, bend, x, foot, offset, far = false, tone) => ({ hip, l1, l2, w, bend, foot: { x, ...foot }, offset, far, tone });

const SPECIES = Object.fromEntries(Object.entries(ART).map(([name, a]) => [name, { colors: a.colors, arms: a.up?.arms ?? null, four: !!a.four, path: !!a.path, beak: !!a.up?.head?.beakTip, wings: !!a.up?.wing }]));




// ---------- colour
const hexToHsl = (hex) => {
  const v = parseInt(hex.slice(1), 16);
  const [r, g, b] = [(v >> 16) & 255, (v >> 8) & 255, v & 255].map((x) => x / 255);
  const hi = Math.max(r, g, b), lo = Math.min(r, g, b), l = (hi + lo) / 2;
  if (hi === lo) return [0, 0, l * 100];
  const d = hi - lo, s = l > 0.5 ? d / (2 - hi - lo) : d / (hi + lo);
  const h = hi === r ? (g - b) / d + (g < b ? 6 : 0) : hi === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [h * 60, s * 100, l * 100];
};
const hsl = (h, s, l) => `hsl(${h.toFixed(0)} ${Math.max(0, Math.min(100, s)).toFixed(0)}% ${Math.max(0, Math.min(100, l)).toFixed(1)}%)`;
// The illustrated look: natural-history drawing on paper, so every tone is lighter and more muted than the
// animal's own colour, and the shade stays soft; the ink line and the fur hatching carry the form.
const toneVars = (name, hex) => {
  const [h, s0, l0] = hexToHsl(hex);
  const s = s0 * 0.62, l = l0 + (100 - l0) * 0.32;
  return `--so-${name}:${hsl(h, s, l)};--so-${name}-lit:${hsl(h - 4, s * 0.85, l + (100 - l) * 0.45)};--so-${name}-shade:${hsl(h + 6, s * 1.05, l * 0.78)}`;
};
const TONES = ["fur", "belly", "dark", "skin", "mark"];

// The subject: the thing the machine works on (the bread, the pencil, the coin) is the one object in the
// machine drawn in its own colour, so the reader can follow it through. subjectCss(selector, light, dark)
// gives a group the kit's tone tokens in that colour, so every solid inside it keeps its shading and lit state.
function subjectCss(sel, light, dark = light) {
  const ramp = (hex, darkTheme) => {
    const [h, s, l] = hexToHsl(hex);
    const L = (k) => hsl(h, s, Math.min(97, l * k));
    const base = darkTheme ? 0.82 : 1;
    return `--anatomy-paper:${L(base)};--anatomy-face:${L(base * 1.06)};--anatomy-top:${L(base * 1.12)};--anatomy-shade-0:${L(base * 0.72)};--anatomy-shade-1:${L(base * 0.8)};--anatomy-shade-2:${L(base * 0.88)};--anatomy-shade-3:${L(base * 0.95)};--anatomy-lit-top:${L(base * 1.16)};--anatomy-lit-shade:${L(base * 0.98)}`;
  };
  return `${sel}{${ramp(light, false)}}.iso[data-theme="dark"] ${sel},.iso:not([data-theme]) ${sel}{${ramp(dark, true)}}`;
}

// Older figures passed a material palette to crewCss. Machines take no colour now, so it is ignored.
const paletteOf = () => ({});

function crewCss() {
  const rules = [
    `.crew .so-tuft,.crew .so-strand,.crew .so-line{fill:none;stroke-linecap:round}`,
    `.crew{--so-ink:color-mix(in srgb,var(--so-fur-shade,#6b5d50) 45%,#3d3631)}`,
    `.crew .so-fig path[fill*="-v-"]{stroke:var(--so-ink);stroke-width:.6px;stroke-linejoin:round;vector-effect:non-scaling-stroke;paint-order:stroke}`,
    `.crew .so-strand{stroke:var(--so-ink)!important;opacity:.6!important;stroke-width:.35px!important;vector-effect:non-scaling-stroke}`,
    `.crew .so-tuft{stroke:var(--so-ink)!important;opacity:.55!important;stroke-width:.45px!important;vector-effect:non-scaling-stroke}`,
    `.crew [fill="#fff"][opacity=".5"]{display:none}`,
    `.crew [fill*="-eye)"],.crew [fill*="-eye)"]~[fill="#fff"]{transform-box:fill-box;transform-origin:center;transform:scale(.72)}`,
    `.crew [data-k="ground"]{opacity:.6}`,
    `.crew[data-duty]>.so-fig{filter:url(#so-duty)}`,
    `.iso{--crew-duty:#ffffff}.iso[data-theme="light"]{--crew-duty:#000000}`,
    `.crew{--so-ground:#000}`,
    `.iso{--so-zap:#FFE14D;--so-zap-core:#FFFBE8}.iso[data-theme="light"]{--so-zap:#E8A600;--so-zap-core:#FFF4C2}`,
  ];
  for (const [name, a] of Object.entries(ART)) {
    rules.push(`.crew[data-species="${name}"]{${TONES.filter((t) => a.colors[t]).map((t) => toneVars(t, a.colors[t])).join(";")};--so-eye:${a.colors.eye ?? "#120c08"};--so-nose:${a.colors.nose ?? a.colors.skin};--so-claw:${a.colors.claw ?? "#efe6da"};--so-whisker:${a.colors.whisker ?? "#f6f1e8"};--so-teeth:${a.colors.teeth ?? "#f4efe6"}}`);
  }
  for (const [name, r] of Object.entries(ROLES)) rules.push(`.crew[data-role="${name}"]{--so-role:${r.hex};--so-role-dark:${hsl(...(([h, s, l]) => [h, s, l * 0.62])(hexToHsl(r.hex)))}}`);
  return rules.join("\n");
}




// ---------- defs: gradients per tone, lit from the top left of the screen
function defs(sp) {
  const a = ART[sp];
  const id = (x) => `so-${sp}-${x}`;
  const out = [];
  const fx = 0.5;
  for (const t of TONES) {
    if (!a.colors[t]) continue;
    out.push(`<radialGradient id="${id(`v-${t}`)}" cx="${fx}" cy=".3" r=".82" fx="${fx}" fy=".26"><stop offset="0" style="stop-color:var(--so-${t}-lit)"/><stop offset=".5" style="stop-color:var(--so-${t})"/><stop offset="1" style="stop-color:var(--so-${t}-shade)"/></radialGradient>`);
    out.push(`<radialGradient id="${id(`s-${t}`)}"><stop offset="0" style="stop-color:var(--so-${t})"/><stop offset=".55" style="stop-color:var(--so-${t});stop-opacity:.92"/><stop offset="1" style="stop-color:var(--so-${t});stop-opacity:0"/></radialGradient>`);
  }
  out.push(`<radialGradient id="${id("ao")}"><stop offset="0" style="stop-color:var(--so-fur-shade);stop-opacity:.75"/><stop offset="1" style="stop-color:var(--so-fur-shade);stop-opacity:0"/></radialGradient>`);
  out.push(`<radialGradient id="${id("ground")}"><stop offset="0" stop-color="#000" stop-opacity=".3"/><stop offset=".6" stop-color="#000" stop-opacity=".14"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>`);
  out.push(`<radialGradient id="${id("eye")}" cx=".42" cy=".36" r=".7"><stop offset="0" style="stop-color:color-mix(in srgb,var(--so-eye) 55%,#7a5236)"/><stop offset=".45" style="stop-color:var(--so-eye)"/><stop offset="1" style="stop-color:var(--so-eye)"/></radialGradient>`);
  out.push(`<filter id="so-duty" x="-20%" y="-20%" width="140%" height="140%"><feMorphology in="SourceAlpha" operator="dilate" radius=".4" result="d"/><feFlood style="flood-color:var(--crew-duty)" result="c"/><feComposite in="c" in2="d" operator="in" result="rim"/><feMerge><feMergeNode in="rim"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`);
  return `<defs>${out.join("")}</defs>`;
}

// ---------- painting helpers (local coordinates)
// Light from above, so a mirrored animal is lit the same way.
const LIGHT = () => [0, -1];
function furShape(sp, pts, tone, o, mirror) {
  const { d, poly } = curve(pts);
  const coat = ART[sp].coat;
  const light = LIGHT(mirror);
  const flow = o.flow ?? coat.flow;
  let s = `<path d="${d}" fill="url(#so-${sp}-v-${tone})"/>`;
  if (coat.shell) {
    // A hard shell: no fur, a soft gloss up and to the left of its middle.
    const [x0, y0, x1, y1] = bounds(poly);
    return s + `<ellipse cx="${n1(x0 + (x1 - x0) * 0.4)}" cy="${n1(y0 + (y1 - y0) * 0.3)}" rx="${n1((x1 - x0) * 0.26)}" ry="${n1((y1 - y0) * 0.16)}" fill="#fff" opacity=".2"/>`;
  }
  const nStr = o.strands ?? 0;
  if (nStr) {

  part("steel").style.opacity = S.fade.toFixed(3);
  part("hot").style.opacity = S.fade.toFixed(3);
  const key = S.th.toFixed(2) + "," + S.hook.toFixed(2);
  const turning = Math.abs(S.th - thPrev) > 0.01;
  thPrev = S.th;
  if (cache.ladle !== key) {
    cache.ladle = key;
    const Ld = ladle(K, P, C, S);
    cache.lip = Ld.lip;
    el.lb.innerHTML = Ld.back; el.body.innerHTML = Ld.body; el.lf.innerHTML = Ld.front; el.ropes.innerHTML = Ld.ropes;
    el.mouth = el.body.querySelector(".sc-mouth");

  if (el.mouth) el.mouth.setAttribute("style", hotCss(S.Tl).replace(/opacity:[0-9.]+/, "opacity:1"));
  stream = S.fade > 0.99 ? streamOf(cache.lip, F) : null;
  el.fb.innerHTML = streamFallback(stream);
  el.spill.innerHTML = spillFallback();
  // On duty: Ollie while the pipe deepens (he is pressing the feed down), Pinch while the lift climbs.
  const feeding = F.pipe > pipePrev + 1e-5 && S.tc > 3 && beat >= 7;
  pipePrev = F.pipe;
  const p = poses(C, S, F, GEO);
  const duty = feeding ? "ollie" : S.liftV > 1.5 && S.tc < 0 && F.riser > C.CAST.z1 ? "pinch" : "";
  paintCrew("ollie", el.ollie, OLLIE, p.ollie, duty === "ollie");
  paintCrew("pinch", el.pinch, PINCH, p.pinch, duty === "pinch");
  el.lf.querySelector(".sc-rim")?.toggleAttribute("data-lit", !duty && turning);
  paintGL();
  const pct = Math.round((S.vm / GEO.vMould) * 100);
  const hb = S.vb / GEO.aBasin;
  const word = S.swap >= 0 ? "a fresh mould" : S.short ? "frozen short" : hb >= GEO.hBasin - 1e-4 && S.q > S.qo ? "overflowing" : S.q > 0.02 ? "pouring" : S.tc < 0 ? (S.vm > 0 ? "filling" : "ready") : S.fsC < 1 ? "freezing" : "solid";
  const text = S.tc < 0 || S.q > 0.02
    ? word + " · " + S.q.toFixed(1) + " kg/s · " + (S.lift > 60 && S.tc < 0 ? "lift " + Math.round(S.lift) + " N" : Math.round(S.tc < 0 && S.vm > 0 ? S.Tm : S.Tl) + " °C") + " · " + pct + "%" + (S.spill > 0.05 ? " · spilt " + S.spill.toFixed(1) + " kg" : "")
    : word + " · " + Math.round(S.Tc) + " °C · " + Math.round(S.fsC * 100) + "% solid · " + Math.floor(S.tc / 60) + ":" + String(Math.floor(S.tc % 60)).padStart(2, "0");
  if (readout.textContent !== text) readout.textContent = text;
}


const DONE = [
  () => S.swap < 0 && S.stepT > 0.3,
  () => S.qo > 0.5 && S.q > PH.QSTAR * 0.85 && S.stepT > 2,
  () => cache.F && cache.F.cast > C.CAST.z0 + 0.6,
  () => cache.F && cache.F.cast >= C.CAST.z1,
  () => S.tc >= 0,
  () => S.th < 0.3 && S.stepT > 0.6,
  () => S.fsG >= 1,
  () => S.fsC >= 1,
  () => S.tc >= GEO.tsCast + 3600,
];
function enter(i, how) {
  beat = i;
  S.manual = false;
  if (i === 0 && how === "loop") S.swap = 0;
  if (i === 0 && how !== "loop") Object.assign(S, fresh(PH), { swap: -1, fade: 1 });
  if (i >= 1 && i <= 4 && S.tc < 0 && !S.short) S.mode = "pour";
  S.stepT = 0;
  lastPose = {};
  draw();
}
const run = STEPS.mountSteps({
  root: document.querySelector("[data-steps]"),
  svg: svgs,
  stage,
  steps: STEP_INFO,
  views: VIEWS,
  colors: COLORS,
  size: SIZE,
  enter,
  update: (dt) => { step(dt); draw(); },
  done: (i) => DONE[i](),
  advance: (dt) => { step(dt); cache.F = fillOf(C, GEO, S, levelZ); },
  draw,
  save: () => JSON.parse(JSON.stringify({ S, beat })),
  load: (x) => { Object.assign(S, JSON.parse(JSON.stringify(x.S))); beat = x.beat; lastPose = {}; cache = {}; },
  onView: (v) => { view = v; paintGL(); },
});
// Take the handwheel: drag the ladle, or press left and right, to set the tilt yourself. The run pauses, the
// camera pulls back, and the model runs on at your tilt: too slow and the steel freezes short, too fast and the
// basin overflows onto the cope. Space plays on from the beat it left, with the mould as you left it.
const said = document.querySelector("[data-said]");
let taken = false, dragging = false, onScreen = false, idleFrame = 0, idleT = 0, grab = null;
function idle(now) {
  idleFrame = 0;
  if (run.playing || !onScreen) return;
  const dt = idleT ? Math.min(1 / 30, (now - idleT) / 1000) : 1 / 60;
  idleT = now;
  step(dt, S.tc < 0 ? 1 : 20);
  draw();
  idleFrame = requestAnimationFrame(idle);
}
function idleStart() { if (!idleFrame) { idleT = 0; idleFrame = requestAnimationFrame(idle); } }
new IntersectionObserver((entries) => { onScreen = entries[entries.length - 1].isIntersecting; if (onScreen && taken) idleStart(); }).observe(stage);
function take() {
  if (run.playing) run.toggle();
  run.aim([0, 0, 640, 580]);
  if (S.swap >= 0) Object.assign(S, fresh(PH), { swap: -1, fade: 1 });
  S.manual = true;
  taken = true;
  idleStart();
}
const tell = () => { said.textContent = "Ladle tipped " + Math.round(S.thT) + " degrees, pouring " + flowOf(C, PH, S.ml, S.thT).toFixed(1) + " kilograms a second"; };
function pointAt(e) {
  const box = svgs[0].getBoundingClientRect(), vb = svgs[0].viewBox.baseVal;
  return [vb.x + ((e.clientX - box.left) / box.width) * vb.width, vb.y + ((e.clientY - box.top) / box.height) * vb.height];
}
stage.addEventListener("pointerdown", (e) => {
  const q = pointAt(e), c = K.iso([C.LADLE.x, 0, S.hook], P);
  if (Math.hypot(q[0] - c[0], q[1] - c[1]) > 46) return;
  dragging = true;
  stage.setPointerCapture(e.pointerId);
  stage.setAttribute("data-grab", "");
  take();
  grab = { x: q[0], y: q[1], th: S.thT };
});
stage.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  const q = pointAt(e);
  S.thT = Math.max(0, Math.min(95, grab.th + (q[0] - grab.x) * 0.9 + (q[1] - grab.y) * 0.5));
});
for (const type of ["pointerup", "pointercancel"]) stage.addEventListener(type, () => { if (dragging) tell(); dragging = false; stage.removeAttribute("data-grab"); });
stage.addEventListener("keydown", (e) => {
  if (e.key === " " && run.playing && taken) {
    // The run's own Space handler has just resumed it: replay this beat from the mould as the reader left it.
    // A mould that froze short is scrap: the run starts a fresh one. Otherwise it plays on from the beat
    // that matches the mould as the reader left it.
    taken = false;
    S.manual = false;
    const F = fillOf(C, GEO, S, levelZ);
    const at = S.short ? 0 : S.tc < 0 ? (S.vm <= 0 ? (S.th > 0.3 ? 1 : run.index) : F.cast <= C.CAST.z0 + 0.6 ? 2 : F.cast < C.CAST.z1 ? 3 : 4) : S.th > 0.3 ? 5 : S.fsG < 1 ? 6 : S.fsC < 1 ? 7 : 8;
    run.go(at);
  } else if (e.key === "Home") { taken = false; S.manual = false; }
  else if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
    e.preventDefault();
    if (!taken) { take(); S.thT = S.th; }
    S.thT = Math.max(0, Math.min(95, S.thT + (e.key === "ArrowRight" ? 1 : -1) * (e.shiftKey ? 10 : 3)));
    tell();
  }
});
