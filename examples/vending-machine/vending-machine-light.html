.iso [data-c="eye"] .iso-edge,.iso [data-c="nose"] .iso-edge{stroke:var(--anatomy-shade-0)}
.so-steps{display:grid;gap:10px;padding:14px 18px 16px;border-top:1px solid var(--anatomy-faint)}
.so-steps-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.so-steps-count{font:600 11px/1 var(--anatomy-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--anatomy-muted)}
.so-steps-title{margin:0;font:600 19px/1.25 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--anatomy-strong);text-wrap:balance}
.so-steps-text{margin:0;max-width:62ch;color:var(--anatomy-text);font-size:14px;line-height:1.55;min-height:3.1em}
.so-steps-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.so-steps-dots{display:flex;gap:6px;flex:1;min-width:0}
.so-steps-dot{flex:1;min-width:14px;height:6px;border-radius:3px;border:0;padding:0;background:var(--anatomy-faint);cursor:pointer}
.so-steps-dot[aria-current="step"]{background:var(--crew-step,var(--anatomy-hi))}
.so-steps-dot[data-done]{background:var(--anatomy-lo)}
.so-steps-btn{font:600 13px/1 ui-sans-serif,system-ui,sans-serif;color:var(--anatomy-strong);background:var(--anatomy-card);border:1px solid var(--anatomy-lo);border-radius:999px;padding:8px 14px;cursor:pointer}
.so-steps-btn[data-primary]{background:var(--anatomy-strong);color:var(--anatomy-card);border-color:var(--anatomy-strong)}
.so-steps-btn:disabled{opacity:.4;cursor:default}
.so-steps-btn:focus-visible,.so-steps-dot:focus-visible{outline:2px solid var(--anatomy-muted);outline-offset:2px}
.so-steps-who{display:inline-flex;align-items:center;gap:6px;font:500 12px/1 var(--anatomy-mono);color:var(--anatomy-muted)}
.so-steps-who i{width:10px;height:10px;border-radius:50%;background:var(--crew-step,var(--anatomy-lo));display:inline-block}
.iso-svg.so-zoom{transition:none}
@media (max-width:560px){.so-steps-dots{order:-1;flex-basis:100%}.so-steps-btn{flex:1}}

.so-void{fill:var(--anatomy-halo);opacity:.55;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.so-coil{stroke-width:.95px}
.so-belt{stroke-width:1.6px}
.so-lcd .iso-face-text{fill:#D9F2D0;font-weight:600;letter-spacing:.08em}

</div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>On duty: whoever is doing the work right now</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Dig, mole, sensing: feels every coin on the coin rail</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Pip, squirrel, moving: catches coins and stacks them in the cash box</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Bun and Mochi, hamsters, power: run the wheel that turns coil B3</span></span><span class="iso-caption">A snack vending machine with its front glass, right side and top cut away, shown one step at a time. A coin rolls down the coin rail past a validator and through a gate into the cash box; pressing B3 sends current to that coil's motor, which turns the spiral coil exactly once, pushing the front snack off the tray and into the bin.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };

function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);

}
function signedArea(points) {

    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];

}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)

    return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}
function runsOf(flags, want) {

        const index = (start + step) % count;

function extrude(ring, z, height, projection, options = {}) {
    const convex = options.convex ?? true;
    const count = ring.length;
    const counter = signedArea(ring) > 0;

  const fine = TAU / Math.max(24, Math.min(192, steps * 1.5));
  const arcPoints = (i, u, from, to) => {
    const count = Math.max(1, Math.ceil((to - from) / fine));
    return Array.from({ length: count + 1 }, (_, index) => pointAt(i, u, from + ((to - from) * index) / count));
  };
  const centreOf = (arc, reference) => {
    let mid = (arc.from + arc.to) / 2 - reference;
    mid = ((mid % TAU) + TAU) % TAU;
    return mid;
  };
  const levelOf = (i, u) => {
    const [nr, na] = normalAt(i, u);
    const groups = new Map();
    for (const arc of labelledArcs(nr, na, view, light, faces[i][0], faces[i][1])) {
      if (!groups.has(arc.tone)) groups.set(arc.tone, []);
      groups.get(arc.tone).push(arc);
    }
    for (const list of groups.values()) list.sort((x, y) => centreOf(x, light.phi) - centreOf(y, light.phi));
    return { i, u, groups };
  };
  const same = (x, y) => {
    if (x.groups.size !== y.groups.size) return false;
    for (const [tone, list] of x.groups) if ((y.groups.get(tone) ?? []).length !== list.length) return false;
    return true;
  };
  const align = (reference, arc) => {
    const out = { ...arc };
    const centre = (reference.from + reference.to) / 2;
    while ((out.from + out.to) / 2 - centre > Math.PI) {
      out.from -= TAU;
      out.to -= TAU;
    }
    while (centre - (out.from + out.to) / 2 > Math.PI) {

      out.to += TAU;
    }
    return out;
  };
  const strayOf = (i, a, mid, b) => {
    let worst = 0;
    for (const [tone, list] of mid.groups) {
      list.forEach((arc, index) => {
        const lo = align(arc, a.groups.get(tone)[index]);
        const hi = align(arc, b.groups.get(tone)[index]);
        for (const key of ["from", "to"]) {
          const p = pointAt(i, mid.u, arc[key]);
          const p0 = pointAt(i, a.u, lo[key]);
          const p1 = pointAt(i, b.u, hi[key]);
          worst = Math.max(worst, Math.hypot(p[0] - (p0[0] + p1[0]) / 2, p[1] - (p0[1] + p1[1]) / 2));
        }
      });
    }
    return worst;
  };
  const sheet = (tone, levels) => {
    levels[0].groups.get(tone).forEach((arc, index) => {
      const chain = [arc];
      for (let k = 1; k < levels.length; k++) chain.push(align(chain[k - 1], levels[k].groups.get(tone)[index]));
      const last = levels.length - 1;
      const points = [...arcPoints(levels[0].i, levels[0].u, chain[0].from, chain[0].to)];
      for (let k = 1; k < last; k++) points.push(pointAt(levels[k].i, levels[k].u, chain[k].to));
      points.push(...arcPoints(levels[last].i, levels[last].u, chain[last].from, chain[last].to).reverse());
      for (let k = last - 1; k >= 1; k--) points.push(pointAt(levels[k].i, levels[k].u, chain[k].from));
      buckets[tone].push(pathOf(oriented(points), true));

  };
  const overlap = (x, y) => Math.min(x.to, y.to) - Math.max(x.from, y.from);
  const strip = (tone, a, b) => {
    const below = a.groups.get(tone) ?? [];
    const above = (b.groups.get(tone) ?? []).map((arc) => ({ arc, used: false }));
    const quad = (lo, hi) => {
      const points = [...arcPoints(a.i, a.u, lo.from, lo.to), ...arcPoints(b.i, b.u, hi.from, hi.to).reverse()];
      buckets[tone].push(pathOf(oriented(points), true));
    };
    for (const arc of below) {
      let best = null;
      let score = -Infinity;
      for (const entry of above) {
        if (entry.used) continue;
        const aligned = align(arc, entry.arc);
        const value = overlap(arc, aligned);
        if (value > score) (score = value), (best = entry);
      }
      if (best && score > -0.05) {
        best.used = true;
        quad(arc, align(arc, best.arc));
      } else {
        const centre = (arc.from + arc.to) / 2;
        quad(arc, { from: centre, to: centre });
      }
    }
    for (const entry of above) {
      if (entry.used) continue;
      const centre = (entry.arc.from + entry.arc.to) / 2;
      quad({ from: centre, to: centre }, entry.arc);
    }

  let run = [];
  const flush = () => {
    const tones = [...new Set(run.flatMap((level) => [...level.groups.keys()]))].sort((x, y) => x - y);
    for (const tone of tones) {
      const countOf = (level) => (level.groups.get(tone) ?? []).length;
      let start = 0;
      for (let at = 1; at <= run.length; at++) {
        if (at < run.length && countOf(run[at - 1]) === countOf(run[at])) continue;
        if (at - 1 > start && countOf(run[start])) sheet(tone, run.slice(start, at));
        if (at < run.length) strip(tone, run[at - 1], run[at]);
        start = at;
      }
    }
    run = [];
  };
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    if (Math.abs(ds) < 1e-9) {
      flush();
      continue;
    }
    const count = Math.max(1, rows);
    const reach = (Math.hypot(ds, meridian[i + 1][1] - meridian[i][1]) * k) / count;
    const limit = Math.max(1, Math.min(deepest, Math.ceil(Math.log2(Math.max(2, reach / fineness)))));
    const coarse = Array.from({ length: count + 1 }, (_, index) => levelOf(i, index / count));
    run.push(coarse[0]);
    const refine = (a, b, depth) => {
      const mid = levelOf(i, (a.u + b.u) / 2);
      const split = depth < limit && (!same(a, b) || !same(a, mid) || (depth < 6 && strayOf(i, a, mid, b) > error));
      if (!split) {
        run.push(b);
        return;
      }
      refine(a, mid, depth + 1);
      refine(mid, b, depth + 1);
    };
    for (let index = 1; index <= count; index++) refine(coarse[index - 1], coarse[index], 0);
  }
  flush();
  return buckets;
}

function sideOf(meridian) {
  const m = meridian.length;
  let first = 0;
  let last = m - 1;
  if (meridian[0][1] <= 1e-9) first = 1;
  if (meridian[m - 1][1] <= 1e-9) last = m - 2;
  const side = meridian.slice(first, last + 1);
  for (let index = 1; index < side.length; index++) if (side[index][0] - side[index - 1][0] <= 1e-9) return null;
  return side.length >= 3 ? side : null;
}

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const facing = Math.atan2(dot3(F.v, V), dot3(F.u, V));
  const [left, right] = silhouettePoints(side, F, P, { samples, slope });
  if (left.length <= samples || right.length <= samples) return null;

  const s1 = side[side.length - 1][0];
  const angleOf = (point) => angleToward(F, sub3(point, add3(F.o, mul3(F.a, dot3(sub3(point, F.o), F.a)))));

    let sweep = wrap(to - from);
    if (wrap(through - from) > sweep) sweep -= TAU;
    const count = Math.max(4, Math.ceil(Math.abs(sweep) / (TAU / 96)), Math.ceil((Math.abs(sweep) * r * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, index) => iso(pointOf(F, s, r, from + (sweep * index) / count), P));
  };
  const r0 = side[0][1];
  const r1 = side[side.length - 1][1];
  const bottom = -aV > 0 ? facing + Math.PI : facing;
  const top = aV > 0 ? facing + Math.PI : facing;
  const L = left.map((point) => iso(point, P));
  const R = right.map((point) => iso(point, P));
  const topArc = arc(s1, r1, angleOf(left[left.length - 1]), angleOf(right[right.length - 1]), top);
  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);
  const keepFirst = rims === "all" || rims === "first" || rims === "ends";
  const keepLast = rims === "all" || rims === "last" || rims === "ends";
  const fill = pathOf([...L, ...topArc, ...[...R].reverse(), ...bottomArc], true);
  const outline = [pathOf(L), pathOf(R), keepLast ? pathOf(topArc) : "", keepFirst ? pathOf(bottomArc) : ""].join("");
  const hull = hullOf([...arc(s0, r0, 0, TAU - 1e-6, Math.PI), ...arc(s1, r1, 0, TAU - 1e-6, Math.PI), ...L, ...R]);
  let gap = 0;
  for (const p of [...L, ...R]) {
    let best = Infinity;
    for (let index = 0; index < hull.length; index++) {
      const a = hull[index];
      const b = hull[(index + 1) % hull.length];
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));
      best = Math.min(best, Math.hypot(p[0] - a[0] - dx * t, p[1] - a[1] - dy * t));
    }
    gap = Math.max(gap, best);
  }
  return { fill, outline, gap };
}

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {

  const V = viewOf(P);
  const L = lightOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const aL = dot3(F.a, L);
  const uL = dot3(F.u, L);
  const vL = dot3(F.v, L);

  const m = meridian.length;

  const midC = [];
  const midS = [];
  for (let j = 0; j < n; j++) {
    const t = ((j + 0.5) / n) * TAU;
    midC.push(Math.cos(t));
    midS.push(Math.sin(t));
  }
  const seen = [];
  const tones = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr);
    const row = [];
    const toneRow = [];
    for (let j = 0; j < n; j++) {
      if (length < 1e-9) {
        row.push(false);
        toneRow.push(0);
        continue;
      }
      const facing = ds * (midC[j] * uV + midS[j] * vV) - dr * aV;
      const lit = (ds * (midC[j] * uL + midS[j] * vL) - dr * aL) / length;
      row.push(facing > 1e-6 * length);
      toneRow.push(bandOf(lit));

    seen.push(row);
    tones.push(toneRow);

  const all = [];
  const smoothed = smooth ? smoothRows(meridian, F, P, { steps, ...(smooth === true ? {} : smooth) }) : null;
  if (smoothed) smoothed.forEach((list, tone) => list.forEach((d) => (buckets[tone].push(d), all.push(d))));

      const b = run.map((j) => rings[i + 1][j]).reverse();

    const dr = meridian[i + 1][1] - meridian[i][1];
    if (Math.hypot(ds, dr) < 1e-9) return null;
    if (Math.abs(ds) < 1e-9 || flatV < 1e-9) return -dr * aV > 1e-9 ? [-1, 1] : null;
    const c = (dr * aV) / (ds * flatV);

    if (ranges.some((range) => !range)) return [];

    const hi = Math.min(...ranges.map(([, x]) => x));
    if (lo >= hi - 1e-9) return [];
    const near = Math.acos(Math.min(1, hi));
    const far = Math.acos(Math.max(-1, lo));
    if (hi >= 1 && lo <= -1) return [[phi, phi + TAU]];

    const count = Math.max(2, Math.ceil(((to - from) * Math.max(r, 1e-6) * scaleOf(P)) / 1.5));

  };
  const creases = [];
  for (let i = 1; i < m - 1; i++) {
    if (meridian[i][2] || meridian[i][1] <= 1e-9) continue;

  }
  let bevelPath = "";
  if (bevel > 0 && m > 2) {
    const ends = [];
    if (meridian[0][1] <= 1e-9) ends.push([0, 1, 1]);
    if (meridian[m - 1][1] <= 1e-9) ends.push([m - 2, m - 2, m - 3]);
    for (const [cap, rim, side] of ends) {
      const [s, r] = meridian[rim];
      for (const arc of arcsOf([rangeOf(cap), rangeOf(side)])) {
        const inset = along(s, Math.max(0, r - bevel), arc);
        const edge = along(s, r, arc);
        bevelPath += pathOf([edge[0], ...inset.slice(1, -1), edge[edge.length - 1]]);
      }

  const { fill: fillPath, outline } = outlineOf(meridian, F, P, { steps: n, fill, hole, rims, smooth, waist, all });
  return {
    fill: fillPath,
    outline,
    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    bevel: bevelPath || undefined,
    seamless: Boolean(smoothed),
  };
}

function shapeOf(meridian, P, smooth) {
  if (smooth && smooth.radius) {
    const segments = meridian.slice(0, -1).map(([s0], index) => (Math.abs(meridian[index + 1][0] - s0) > 1e-9 ? { radius: smooth.radius, slope: smooth.slope } : null));
    return curved(meridian, P, segments);
  }
  const curves = smooth && !smooth.slope ? curveRuns(meridian) : null;
  return curves && curves.some(Boolean) ? curved(meridian, P, curves) : meridian;
}

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const n = steps;
  let fillPath;
  let outline;
  const shape = shapeOf(meridian, P, smooth);
  const side = fill === "auto" || fill === "surface" ? sideOf(shape) : null;
  const surface = side && !hole ? surfaceOf(side, F, P, rims, { slope: smooth && smooth.slope ? smooth.slope : null }) : null;
  if (surface && (fill === "surface" || surface.gap > waist)) {
    fillPath = surface.fill;
    outline = surface.outline;
  } else if (fill === "hull" || fill === "auto" || fill === "surface") {
    const most = Math.max(...shape.map(([, r]) => r));
    const around = Math.min(320, Math.max(n, Math.ceil((TAU * most * scaleOf(P)) / 1.5)));
    const tagged = [];
    shape.forEach(([s, r], index) => {
      for (let j = 0; j < around; j++) tagged.push({ p: iso(pointOf(F, s, r, (j / around) * TAU), P), ring: index });
    });
    const hull = hullTagged(tagged);
    const holePath = hole ? pathOf(Array.from({ length: around }, (_, j) => iso(pointOf(F, hole[0], hole[1], (j / around) * TAU), P)), true) : "";
    fillPath = pathOf(hull.map(({ p }) => p), true) + holePath;
    if (rims === "all") {
      outline = pathOf(hull.map(({ p }) => p), true) + holePath;
    } else {
      const keepFirst = rims === "first" || rims === "ends";
      const keepLast = rims === "last" || rims === "ends";
      const edges = hull.map((a, index) => {
        const b = hull[(index + 1) % hull.length];
        const same = a.ring === b.ring;
        const keep = !same || (a.ring !== 0 && a.ring !== shape.length - 1) || (keepFirst && a.ring === 0) || (keepLast && a.ring === shape.length - 1);
        return [a.p, b.p, keep];
      });
      outline = chains(edges).map((points) => pathOf(points)).join("") + holePath;
    }
  } else {
    fillPath = all ? all.join("") : (({ shades, top }) => [...shades, top].join(""))(lathe(meridian, F, P, { steps: n, fill: "auto", hole, rims, smooth, waist }));
    outline = "";

  return { fill: fillPath, outline };
}

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];
  return sum + x * ny - nx * y;
}, 0);

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

function saddleOf(F, a, start, s1, P, { steps = stepsFor(a, 24) } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const n = steps;
  const angle = (j) => (j / n) * TAU;
  const from = typeof start === "function" ? start : (t) => saddleStart(start, a, t);
  const low = Array.from({ length: n }, (_, j) => iso(pointOf(F, from(angle(j)), a, angle(j)), P));
  const high = Array.from({ length: n }, (_, j) => iso(pointOf(F, s1, a, angle(j)), P));
  const seen = [];
  const tones = [];
  for (let j = 0; j < n; j++) {
    const normal = radialOf(F, angle(j + 0.5));
    seen.push(dot3(normal, V) > 1e-6);
    tones.push(bandOf(dot3(normal, L)));
  }
  const buckets = [[], [], [], [], []];
  const fills = [];
  const keys = seen.map((visible, j) => (visible ? tones[j] : null));
  for (const { key, run } of groupsOf(keys)) {
    const d = pathOf(oriented([...run.map((j) => low[j]), ...run.map((j) => high[j]).reverse()]), true);
    buckets[key].push(d);
    fills.push(d);
  }
  const capSeen = dot3(F.a, V) > 1e-6;
  if (capSeen) {
    const d = pathOf(oriented(high), true);
    buckets[bandOf(dot3(F.a, L))].push(d);
    fills.push(d);
  }
  const front = runsOf(seen);
  const back = runsOf(seen.map((visible) => !visible));
  const edges = [];
  for (const run of front) {
    edges.push(pathOf(run.map((j) => low[j])));
    edges.push(pathOf([low[run[0]], high[run[0]]]), pathOf([low[run[run.length - 1]], high[run[run.length - 1]]]));
  }
  for (const run of capSeen ? back : front) edges.push(pathOf(run.map((j) => high[j])));
  return {
    fill: fills.join(""),
    outline: edges.join(""),
    crease: capSeen ? front.map((run) => pathOf(run.map((j) => high[j]))).join("") : "",
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    seamless: true,
  };
}

function prismOf(F, polygon, s0, s1, P) {
  const V = viewOf(P);
  const L = lightOf(P);
  const ring = oriented(polygon.map(([x, y]) => [x, y]));
  const n = ring.length;
  const at = (s, [x, y]) => [F.o[0] + F.a[0] * s + F.u[0] * x + F.v[0] * y, F.o[1] + F.a[1] * s + F.u[1] * x + F.v[1] * y, F.o[2] + F.a[2] * s + F.u[2] * x + F.v[2] * y];
  const low = ring.map((point) => iso(at(s0, point), P));
  const high = ring.map((point) => iso(at(s1, point), P));
  const buckets = [[], [], [], [], []];

  for (let j = 0; j < n; j++) {
    const [x0, y0] = ring[j];
    const [x1, y1] = ring[(j + 1) % n];

    const visible = dot3(normal, V) > 1e-6;
    seen.push(visible);
    if (visible) buckets[bandOf(dot3(normal, L))].push(pathOf([low[j], low[(j + 1) % n], high[(j + 1) % n], high[j]], true));

  ends.forEach(([, points, normal], index) => capSeen[index] && buckets[bandOf(dot3(normal, L))].push(pathOf(points, true)));

  for (let j = 0; j < n; j++) {
    const prev = (j - 1 + n) % n;
    const a = [ring[j][0] - ring[prev][0], ring[j][1] - ring[prev][1]];
    const b = [ring[(j + 1) % n][0] - ring[j][0], ring[(j + 1) % n][1] - ring[j][1]];
    const sharp = (a[0] * b[0] + a[1] * b[1]) / (Math.hypot(a[0], a[1]) * Math.hypot(b[0], b[1]) || 1) < Math.cos(0.35);

  }
  return { fill: pathOf(hull, true), outline: pathOf(hull, true), crease: creases.join(""), top: buckets[4].join(""), shades: buckets.slice(0, 4).map((list) => list.join("")) };

function stadium(r0, r1, offset, steps = 32) {

function silhouettePoints(profile, F, P, { samples = 72, slope: given = null, radius = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const facing = Math.atan2(vV, uV);
  const flat = Math.hypot(uV, vV) || 1e-9;
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const radiusAt = radius ?? ((s) => {
    let index = 1;
    while (index < profile.length - 1 && profile[index][0] < s) index++;
    const [sa, ra] = profile[index - 1];
    const [sb, rb] = profile[index];
    return ra + ((rb - ra) * (s - sa)) / (sb - sa || 1);
  });
  const side = (sign) => {
    const points = [];
    for (let step = 0; step <= samples; step++) {
      const s = s0 + ((s1 - s0) * step) / samples;
      const h = (s1 - s0) / samples / 2 || 0.01;
      const slope = given ? given(s) : (radiusAt(Math.min(s1, s + h)) - radiusAt(Math.max(s0, s - h))) / (Math.min(s1, s + h) - Math.max(s0, s - h) || 1);
      const c = (slope * aV) / flat;
      if (Math.abs(c) > 1) continue;
      points.push(pointOf(F, s, radiusAt(s), facing + sign * Math.acos(c)));
    }
    return points;
  };

}

function profileCurve(profile, { slope = null, radius = null } = {}) {

  const segments = curveRuns(profile);
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const find = (s) => {
    let lo = 0;
    let hi = profile.length - 2;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (profile[mid][0] <= s) lo = mid;
      else hi = mid - 1;
    }

  };

    const [sa, ra] = profile[index];
    const [sb, rb] = profile[index + 1];
    return [ra + ((rb - ra) * (s - sa)) / (sb - sa), (rb - ra) / (sb - sa)];
  };

    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].radius(at) : linear(index, at)[0];
  });

    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].slope(at) : linear(index, at)[1];

    if (!full)

        const lo = Math.max(a + turn * TAU, from);
        const hi = Math.min(b + turn * TAU, to);

const fadeOf = (value, [lo, hi]) => {

function ribsOf(F, s0, s1, r, count, P, { phase = 0, twist = 0, least = 0.12, r1 = r, fade = null, seams = false } = {}) {

    const normal = unit3([radial[0] - slope * F.a[0], radial[1] - slope * F.a[1], radial[2] - slope * F.a[2]]);

    const into = unit3(sub3(here, prev));
    const outOf = unit3(sub3(next, here));
    const cosTurn = Math.max(-1, Math.min(1, dot3(into, outOf)));

      out.push(lerp3(a, b, t1));

}

const MATERIALS = {
  shell: { hex: "#E3EBE5", use: "housing, lids, covers" },
  inside: { hex: "#E6ECE6", use: "inner walls and backs of a cutaway" },
  steel: { hex: "#CBD3DD", use: "decks, plates, brackets, gears" },
  iron: { hex: "#A9B2BF", use: "axles, posts, pins, heavy parts" },
  brass: { hex: "#E4D6B4", use: "bushings, bearings, terminals" },
  plastic: { hex: "#E2D8EC", use: "knobs, buttons, switch bodies" },
  wood: { hex: "#E8CFAA", use: "pencil wood, shavings, light timber" },
  desk: { hex: "#C9A27A", use: "desk tops, benches, floors" },
  wall: { hex: "#EFEBE4", use: "room walls behind the scene" },
  paint: { hex: "#9FB4D3", use: "the subject's painted body" },
  rubber: { hex: "#EDBDB6", use: "erasers, feet, grips" },
  paper: { hex: "#FBF8F1", use: "notebooks, labels, paper" },
  graphite: { hex: "#4B4B52", use: "pencil lead, dark inserts" },

const FIXED = { eye: "#1E1712", white: "#FFFDF7", pink: "#E7A3A0", pinkdark: "#C9706C", nose: "#2A1D16" };

const hexToHsl = (hex) => {
  const n = parseInt(hex.slice(1), 16);
  const [r, g, b] = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => v / 255);
  const hi = Math.max(r, g, b), lo = Math.min(r, g, b), l = (hi + lo) / 2;
  if (hi === lo) return [0, 0, l * 100];
  const d = hi - lo, s = l > 0.5 ? d / (2 - hi - lo) : d / (hi + lo);
  const h = hi === r ? (g - b) / d + (g < b ? 6 : 0) : hi === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [h * 60, s * 100, l * 100];
};
const hsl = (h, s, l) => `hsl(${h.toFixed(0)} ${Math.max(0, Math.min(100, s)).toFixed(0)}% ${Math.max(0, Math.min(100, l)).toFixed(1)}%)`;

function tokensOf(hex, theme) {
  const [h, s, l] = hexToHsl(hex);
  if (theme === "light") {
    return {
      paper: hsl(h, s, l), face: hsl(h, s, l + 3), top: hsl(h, s, l + 7),
      "shade-0": hsl(h, s, l - 13), "shade-1": hsl(h, s, l - 7), "shade-2": hsl(h, s, l - 2), "shade-3": hsl(h, s, l + 4),
      "lit-top": hsl(h, s, l + 9), "lit-shade": hsl(h, s, l + 1),
      hi: hsl(h, s * 0.55, Math.min(24, l * 0.35)), mid: hsl(h, s * 0.5, l * 0.6), lo: hsl(h, s * 0.45, l * 0.78), faint: hsl(h, s * 0.4, l - 9),
    };
  }
  const d = Math.max(16, Math.min(44, l * 0.62));
  const sd = s * 0.78;
  return {
    paper: hsl(h, sd, d), face: hsl(h, sd, d + 3), top: hsl(h, sd, d + 7),
    "shade-0": hsl(h, sd, d - 8), "shade-1": hsl(h, sd, d - 4), "shade-2": hsl(h, sd, d + 1), "shade-3": hsl(h, sd, d + 6),
    "lit-top": hsl(h, sd, d + 10), "lit-shade": hsl(h, sd, d + 3),
    hi: hsl(h, s * 0.45, 84), mid: hsl(h, s * 0.45, 64), lo: hsl(h, s * 0.4, 46), faint: hsl(h, sd, d + 10),
  };
}

function paletteOf() {
  const out = {};
  for (const [name, sp] of Object.entries(SPECIES)) {
    for (const key of ["fur", "belly", "dark", "face"]) if (sp[key]) out[`${name}-${key}`] = sp[key];
  }
  for (const [name, role] of Object.entries(ROLES)) out[`role-${name}`] = role.hex;
  for (const [name, mat] of Object.entries(MATERIALS)) out[`mat-${name}`] = mat.hex;
  return { ...out, ...FIXED };
}

const tokenCss = (tokens) => Object.entries(tokens).map(([key, value]) => `--anatomy-${key}:${value}`).join(";");

function crewCss(palette = paletteOf()) {
  const rules = [
    `.crew{--anatomy-weight:.8px}`,
    `.crew[data-duty] .iso-edge{stroke:var(--crew-duty);stroke-width:1.15px}`,
    `.iso{--crew-duty:#ffffff}.iso[data-theme="light"]{--crew-duty:#000000}`,
    `.crew-patch{stroke:none;fill:var(--anatomy-top)}`,
    `.crew-patch[data-shade="mid"]{fill:var(--anatomy-paper)}`,
    `.crew-gleam{stroke:none;fill:#fffdf7}`,
  ];
  for (const [key, hex] of Object.entries(palette)) {
    rules.push(`.iso [data-c="${key}"]{${tokenCss(tokensOf(hex, "dark"))}}`);
    rules.push(`.iso[data-theme="light"] [data-c="${key}"],.iso [data-theme="light"] [data-c="${key}"]{${tokenCss(tokensOf(hex, "light"))}}`);
  }
  rules.push(`.iso [data-c="eye"] .iso-edge,.iso [data-c="nose"] .iso-edge{stroke:var(--anatomy-shade-0)}`);
  return rules.join("\n");
}

const rot = (v, axis, a) => {
  const c = Math.cos(a), s = Math.sin(a), k = unit3(axis);
  return add3(add3(mul3(v, c), mul3(cross3(k, v), s)), mul3(k, dot3(k, v) * (1 - c)));
};

const BANDS = [0, 0.2, 0.42, 0.62];

function ellipsoidOf(centre, [a, b, c], P, { steps = 32, clip = null } = {}) {
  const bc = cross3(b, c), ca = cross3(c, a), ab = cross3(a, b);
  const det = dot3(a, bc);
  const inv = (w) => [dot3(bc, w) / det, dot3(ca, w) / det, dot3(ab, w) / det];
  const Vu = unit3(inv(viewOf(P)));
  const Lu = unit3(inv(lightOf(P)));
  const map = (u) => iso(add3(centre, add3(add3(mul3(a, u[0]), mul3(b, u[1])), mul3(c, u[2]))), P);
  const circle = (axis, h) => {
    const F = frameAlong([0, 0, 0], axis), r = Math.sqrt(Math.max(0, 1 - h * h));
    return Array.from({ length: steps }, (_, i) => pointOf(F, h, r, (i / steps) * TAU));
  };
  let Nu = null, Hc = 0;
  if (clip) {
    const raw = [dot3(a, clip.n), dot3(b, clip.n), dot3(c, clip.n)];
    const k = len3(raw);
    Nu = mul3(raw, 1 / k);
    Hc = (clip.d ?? 0) / k;
  }
  const inside = (u) => !Nu || dot3(u, Nu) >= Hc - 1e-9;
  const rim = circle(Vu, 0);
  const cut = Nu ? circle(Nu, Hc) : [];
  const outline = pathOf(hullOf([...rim.filter(inside), ...cut].map(map)), true);
  const capOf = (t) => {
    const pts = rim.filter((u) => dot3(u, Lu) >= t && inside(u));
    for (const u of circle(Lu, t)) if (dot3(u, Vu) >= -1e-9 && inside(u)) pts.push(u);
    for (const u of cut) if (dot3(u, Vu) >= -1e-9 && dot3(u, Lu) >= t) pts.push(u);
    if (dot3(Vu, Lu) > t && inside(Vu)) pts.push(Vu);
    return pts.length > 2 ? pathOf(hullOf(pts.map(map)), true) : "";
  };
  return { fill: outline, outline, crease: "", top: "", shades: [outline, capOf(BANDS[1]), capOf(BANDS[2]), capOf(BANDS[3])], seamless: true };
}

const along = (centre, axis, half, r0, r1 = r0) => {
  const F = frameAlong(centre, axis);
  return [centre, [mul3(F.a, half), mul3(F.u, r0), mul3(F.v, r1)]];
};

const ellipseOn = (c, n, r, P, { squash = 1, spin = 0, steps = 16, lift = 0 } = {}) => {
  const F = frameAlong(add3(c, mul3(unit3(n), lift)), n);
  const u = rot(F.u, F.a, spin), v = rot(F.v, F.a, spin);
  const pts = Array.from({ length: steps }, (_, i) => {
    const t = (i / steps) * TAU;
    return iso(add3(F.o, add3(mul3(u, r * Math.cos(t)), mul3(v, r * squash * Math.sin(t)))), P);
  });
  return pathOf(pts, true);
};

const arcOn = (c, n, r, P, { bend = 1, spin = 0, steps = 9 } = {}) => {
  const F = frameAlong(c, n);
  const u = rot(F.u, F.a, spin), v = rot(F.v, F.a, spin);
  const pts = Array.from({ length: steps }, (_, i) => {
    const t = Math.PI * (i / (steps - 1));
    return iso(add3(c, add3(mul3(u, r * Math.cos(t)), mul3(v, -bend * r * 0.55 * Math.sin(t)))), P);
  });
  return pathOf(pts);
};

const bandOnSphere = (c, axis, R, z0, z1, P, V, steps = 40) => {
  const F = frameAlong(c, axis);
  const ring = (z) => {
    const rho = Math.sqrt(Math.max(0, R * R - z * z)) * 1.035;
    return Array.from({ length: steps + 1 }, (_, i) => {
      const t = (i / steps) * TAU;
      const radial = add3(mul3(F.u, Math.cos(t)), mul3(F.v, Math.sin(t)));
      return { p: add3(add3(c, mul3(F.a, z)), mul3(radial, rho)), seen: dot3(radial, V) > -0.05 };
    });
  };
  const top = ring(z1), bottom = ring(z0);
  const seen = top.map((q, i) => q.seen && bottom[i].seen);
  let start = seen.findIndex((s, i) => s && !seen[(i - 1 + steps) % steps]);
  if (start < 0) start = 0;
  const idx = [];
  for (let k = 0; k <= steps; k++) {
    const i = (start + k) % steps;
    if (!seen[i]) break;
    idx.push(i);
  }
  if (idx.length < 2) return "";
  const pts = [...idx.map((i) => iso(top[i].p, P)), ...idx.reverse().map((i) => iso(bottom[i].p, P))];
  return pathOf(pts, true);
};

function critter(spec, pose, P) {
  const sp = typeof spec.species === "string" ? SPECIES[spec.species] : spec.species;
  const name = typeof spec.species === "string" ? spec.species : spec.name;
  if (!sp) throw new Error(`unknown species ${spec.species}`);
  const H = spec.size;
  const V = viewOf(P);
  const Lgt = lightOf(P);
  const parts = [];
  const cOf = (key) => (["fur", "belly", "dark", "face"].includes(key) ? `${name}-${key}` : key);
  const front = (c, r) => depthOf(add3(c, mul3(V, r)), P);
  const put = (part) => parts.push(part);
  const ball = (key, c, at, r, extra = 0) => put({ key, kind: "solid", c, paths: sphereOf(at, r, P, { steps: Math.max(16, Math.min(48, Math.round(r * scaleOf(P) * 4))) }), depth: front(at, r) + extra, at, r });
  const blob = (key, c, beads, split = null) => {
    const groups = split ? [beads.filter((b) => dot3(sub3(b.at, split), V) < 0), beads.filter((b) => dot3(sub3(b.at, split), V) >= 0)] : [beads];
    groups.forEach((list, g) => {
      if (!list.length) return;
      const sorted = [...list].sort((a, b) => front(a.at, a.r) - front(b.at, b.r));
      const balls = sorted.map((b) => sphereOf(b.at, b.r, P, { steps: Math.max(14, Math.min(28, Math.round(b.r * scaleOf(P) * 3))) }));
      const depth = split ? (g === 0 ? Math.min(...list.map((b) => front(b.at, 0))) : Math.max(...list.map((b) => front(b.at, b.r)))) : Math.max(...list.map((b) => front(b.at, b.r * 0.5)));
      put({ key: `${key}${g}`, kind: "blob", c, balls, depth });
    });
  };

  const heading = (pose.heading ?? 0) * RAD;
  const f0 = [Math.cos(heading), Math.sin(heading), 0];
  const side = [-Math.sin(heading), Math.cos(heading), 0];
  const up0 = [0, 0, 1];
  const lean = (pose.lean ?? 0) * RAD;
  const f = add3(mul3(f0, Math.cos(lean)), mul3(up0, -Math.sin(lean)));
  const up = add3(mul3(up0, Math.cos(lean)), mul3(f0, Math.sin(lean)));
  const squash = pose.squash ?? 0;
  const sx = 1 + 0.1 * squash, sz = 1 - 0.14 * squash;
  const base = add3(pose.at, [0, 0, (pose.hop ?? 0)]);
  const hipZ = sp.body.z + 0.08;
  const hip = add3(base, mul3(up0, hipZ * H));
  const W = ([x, y, z]) => add3(hip, add3(add3(mul3(f, x * H * sx), mul3(side, y * H * sx)), mul3(up, (z - hipZ) * H * sz)));
  const D = ([x, y, z]) => unit3(add3(add3(mul3(f, x), mul3(side, y)), mul3(up, z)));

  const ell = (key, c, centre, axes, extra = 0, opts = {}) => {
    const r = Math.max(...axes.map(len3));
    put({ key, kind: "solid", c, paths: ellipsoidOf(centre, axes, P, { steps: Math.max(18, Math.min(44, Math.round(r * scaleOf(P) * 3))), ...opts }), depth: front(centre, r) + extra });
  };
  const B = sp.body;
  const bodyBase = W([0, 0, B.z]);
  const bodyLen = B.h * H * sz;
  const R = B.r * H * sx;
  const bodyMid = add3(bodyBase, mul3(up, bodyLen * 0.5));
  const bodyDepth = front(bodyMid, R);
  ell("body", cOf("fur"), bodyMid, [mul3(f, R), mul3(side, R), mul3(up, bodyLen * 0.5)]);
  if ((B.egg ?? 0) > 0.12) ell("hips", cOf("fur"), add3(bodyBase, mul3(up, bodyLen * 0.3)), [mul3(f, R * 1.06), mul3(side, R * 1.06), mul3(up, bodyLen * 0.3)], 0.0002);

  const bellyZ = -0.12;
  const bellyN = unit3(add3(f, mul3(up, 0.15)));
  const bellyAt = add3(add3(bodyMid, mul3(up, bodyLen * 0.5 * bellyZ)), mul3(f, R * Math.sqrt(1 - bellyZ * bellyZ) * 0.98));
  if (dot3(bellyN, V) > 0.05) put({ key: "belly", kind: "patch", c: cOf("belly"), d: ellipseOn(bellyAt, bellyN, B.r * H * 0.5, P, { squash: 1.35 }), depth: bodyDepth + 0.001, shade: "mid", edge: "faint" });

  const Hd = sp.head;
  const yaw = (pose.look?.[0] ?? 0) * RAD, pitch = (pose.look?.[1] ?? 0) * RAD;
  const hf0 = rot(f, up, yaw);
  const hs = rot(side, up, yaw);
  const hf = rot(hf0, hs, -pitch);
  const hu = rot(up, hs, -pitch);
  const headC = W([Hd.x, 0, Hd.z]);
  const hr = Hd.r * H;
  const headDepth = front(headC, hr);
  const HD = ([x, y, z]) => unit3(add3(add3(mul3(hf, x), mul3(hs, y)), mul3(hu, z)));
  const onHead = (az, el, out = 1) => {
    const dir = HD([Math.cos(el * RAD) * Math.cos(az * RAD), Math.cos(el * RAD) * Math.sin(az * RAD), Math.sin(el * RAD)]);
    return { dir, p: add3(headC, mul3(dir, hr * out)) };
  };
  ball("head", cOf("fur"), headC, hr);
  const flat = (p, axis, r, t = 0.2) => along(p, axis, r * t, r, r);

  const feature = (key, colour, p, n, r, extra, opt) => {
    if (dot3(n, V) > 0.06) put({ key, kind: "patch", c: colour, d: ellipseOn(p, n, r, P, opt), depth: headDepth + extra, shade: "mid", edge: opt?.edge ?? "faint" });
  };

  if (sp.mask) {
    const m = onHead(0, -4);
    feature("mask", cOf("face"), m.p, m.dir, hr * 0.7, 0.0005, { squash: 0.78 });
  }
  if (sp.patches) {
    for (const s of [-1, 1]) {
      const e = onHead(s * sp.eyes.az, sp.eyes.el);
      feature(`patch${s}`, cOf("dark"), e.p, e.dir, hr * 0.17, 0.0007, { squash: 0.6, spin: -s * 0.35 });
    }
  }

  const E = spec.wear === "hat" || spec.wear === "cap" ? { kind: "none" } : sp.ears;
  if (E.kind === "round") {
    for (const s of [-1, 1]) {
      const at = onHead(s * E.az, E.el, 0.93);
      const axis = unit3(add3(mul3(hf, 0.85), mul3(at.dir, 0.35)));
      const er = E.r * H;
      const dep = front(at.p, er);
      ell(`ear${s}`, cOf("fur"), ...flat(at.p, axis, er));
      if (dot3(axis, V) > 0.1) put({ key: `earIn${s}`, kind: "patch", c: E.inner === "dark" ? cOf("dark") : "pink", d: ellipseOn(add3(at.p, mul3(axis, er * 0.19)), axis, er * 0.6, P), depth: dep + 0.0005 });
    }
  } else if (E.kind === "point") {
    for (const s of [-1, 1]) {
      const at = onHead(s * E.az, E.el, 0.85);
      const axis = unit3(add3(mul3(at.dir, 0.7), mul3(hu, 0.6)));
      const er = E.r * H, eh = E.h * H;
      const tipC = add3(at.p, mul3(axis, eh * 0.5));
      const [, axes] = along(tipC, axis, eh * 0.55, er, er * 0.55);
      ell(`ear${s}`, cOf("fur"), tipC, axes);
    }
  }

  const N = sp.snout;
  let noseAt = onHead(0, -8, 1.0).p, noseDir = hf;
  if (N.kind === "cheeks") {
    for (const s of [-1, 1]) {
      const at = add3(headC, add3(add3(mul3(hf, hr * 0.78), mul3(hs, s * hr * 0.42)), mul3(hu, -hr * 0.38)));
      ball(`cheek${s}`, cOf("belly"), at, N.r * H, 0);
    }
    noseAt = add3(headC, add3(mul3(hf, hr * 1.0), mul3(hu, -hr * 0.12)));
  } else if (N.kind === "muzzle") {
    const at = add3(headC, add3(mul3(hf, hr * 0.82 + (N.x ?? 0) * 0), mul3(hu, (N.z ?? -0.04) * H)));
    const mr = N.r * H;
    ball("muzzle", cOf(N.c ?? "belly"), at, mr, 0);
    noseAt = add3(at, add3(mul3(hf, mr * 0.92), mul3(hu, mr * 0.35)));
  } else if (N.kind === "long") {
    const base = add3(headC, add3(mul3(hf, hr * 0.7), mul3(hu, -hr * 0.18)));
    const tip = add3(base, mul3(hf, N.len * H));
    ell("snout", N.c ?? "pink", ...along(mul3(add3(base, tip), 0.5), hf, N.len * H * 0.6, N.r * H, N.r * H * 0.85));
    noseAt = add3(tip, mul3(hf, N.r * H * 0.45));
  }
  const nr = sp.nose.r * H;
  ball("nose", sp.nose.c, noseAt, nr, 0);
  if (sp.teeth && dot3(hf, V) > -0.2) {
    const at = add3(noseAt, add3(mul3(hu, -nr * 3.2), mul3(hf, -nr * 0.6)));
    const F = frameOf(at, hf, unit3(cross3(hu, hf)), hu);
    const tw = nr * 1.9, th = nr * 2.4;
    const paths = prismOf(F, [[-tw, 0], [tw, 0], [tw, -th], [-tw, -th]], -nr * 0.25, nr * 0.25, P);
    put({ key: "teeth", kind: "solid", c: "white", paths, depth: front(at, nr * 2) + 0.002 });
  }

  const eyes = pose.eyes ?? "open";
  const er = sp.eyes.r * H * (eyes === "wide" ? 1.35 : 1);
  for (const s of [-1, 1]) {
    const e = onHead(s * sp.eyes.az, sp.eyes.el, 1);
    if (dot3(e.dir, V) < 0.02) continue;
    if (eyes === "shut" || eyes === "happy" || (pose.blink ?? 0) > 0.5) {
      const bend = eyes === "happy" ? -1 : 1;
      put({ key: `eye${s}`, kind: "line", c: "eye", tone: "hi", d: arcOn(add3(e.p, mul3(e.dir, er * 0.15)), e.dir, er * 1.05, P, { bend }), depth: headDepth + 0.003 });
    } else {
      const c = add3(headC, mul3(e.dir, hr - er * 0.35));
      if (eyes === "wide") {
        const wc = add3(headC, mul3(e.dir, hr - er * 0.55));
        put({ key: `eyeW${s}`, kind: "solid", c: "white", paths: sphereOf(wc, er * 1.15, P, { steps: 32 }), depth: headDepth + 0.002 });
        const pc = add3(headC, mul3(e.dir, hr + er * 0.2));
        put({ key: `eye${s}`, kind: "solid", c: "eye", paths: sphereOf(pc, er * 0.55, P, { steps: 24 }), depth: headDepth + 0.003 });
      } else {
        put({ key: `eye${s}`, kind: "solid", c: "eye", paths: sphereOf(c, er, P, { steps: 32 }), depth: headDepth + 0.003 });
        const g = unit3(add3(mul3(V, 1), mul3(Lgt, 0.6)));
