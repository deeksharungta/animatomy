.crew[data-role="moving"]{--so-role:#46A758;--so-role-dark:hsl(131 41% 28.8%)}
.crew[data-role="heat"]{--so-role:#F76B15;--so-role-dark:hsl(23 93% 32.6%)}
.crew[data-role="fluid"]{--so-role:#12A594;--so-role-dark:hsl(173 80% 22.2%)}
.crew[data-role="spring"]{--so-role:#E93D82;--so-role-dark:hsl(336 80% 35.7%)}
.so-steps{display:grid;gap:8px;padding:14px 18px 16px;border-top:1px solid var(--anatomy-faint)}
.so-steps-who{display:inline-flex;align-items:center;gap:6px;font:500 12px/1 var(--anatomy-mono);color:var(--anatomy-muted);min-height:12px}
.so-steps-who i{width:10px;height:10px;border-radius:50%;background:var(--crew-step,var(--anatomy-lo));display:inline-block}
.so-steps-title{margin:0;font:600 19px/1.25 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--anatomy-strong);text-wrap:balance}
.so-steps-text{margin:0;max-width:62ch;color:var(--anatomy-text);font-size:14px;line-height:1.55;min-height:4.65em}
.so-steps-track{display:flex;gap:4px;margin-top:4px}
.so-steps-track i{flex:1;height:3px;border-radius:2px;background:var(--anatomy-faint);overflow:hidden;position:relative}
.so-steps-track i[data-done]{background:var(--anatomy-lo)}
.so-steps-track i[data-now]::after{content:"";position:absolute;inset:0;background:var(--crew-step,var(--anatomy-hi));transform-origin:left;transform:scaleX(var(--so-beat,0))}
.so-steps[data-paused] .so-steps-who::after{content:"paused";margin-left:6px;letter-spacing:.08em;text-transform:uppercase;font-size:10px}
.so-steps p{transition:opacity .25s ease}
.so-steps[data-swap] p{opacity:.35}
@media (prefers-reduced-motion:reduce){.so-steps p{transition:none}}

.so-coil{stroke-width:.95px}
.so-belt{stroke-width:1.6px}
.so-lcd .iso-face-text{font-weight:600;letter-spacing:.08em}

const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);

}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;

}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)

    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)

        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {

    return [...lower.slice(0, -1), ...upper.slice(0, -1)];

function runsOf(flags, want) {
    const count = flags.length;

      split(s0, s1, 0);

function smoothRows(meridian, F, P, { rows = 6, slope = null, radius = null, steps = 48, error = 0.35, depth: deepest = 8, fineness = 0.1 } = {}) {

    const b = faces[k];
    const x = a[0] + b[0];
    const y = a[1] + b[1];
    const length = Math.hypot(x, y) || 1;

    const [s0] = meridian[i];

    const b = vertexNormal(i + 1, faces[i]);

      out.to -= TAU;

    const above = (b.groups.get(tone) ?? []).map((arc) => ({ arc, used: false }));

      const points = [...arcPoints(a.i, a.u, lo.from, lo.to), ...arcPoints(b.i, b.u, hi.from, hi.to).reverse()];

    }
    run = [];
  };
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];

      continue;
    }
    const count = Math.max(1, rows);
    const reach = (Math.hypot(ds, meridian[i + 1][1] - meridian[i][1]) * k) / count;

        return;
      }
      refine(a, mid, depth + 1);
      refine(mid, b, depth + 1);
    };
    for (let index = 1; index <= count; index++) refine(coarse[index - 1], coarse[index], 0);
  }
  flush();
  return buckets;
}

function sideOf(meridian) {

  let last = m - 1;

  if (meridian[m - 1][1] <= 1e-9) last = m - 2;
  const side = meridian.slice(first, last + 1);
  for (let index = 1; index < side.length; index++) if (side[index][0] - side[index - 1][0] <= 1e-9) return null;

    for (let index = 0; index < hull.length; index++) {

      const dy = b[1] - a[1];

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {

function shapeOf(meridian, P, smooth) {

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {

const signedArea = (points) => points.reduce((sum, [x, y], index) => {

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

    edges.push(pathOf([low[run[0]], high[run[0]]]), pathOf([low[run[run.length - 1]], high[run[run.length - 1]]]));
  }
  for (const run of capSeen ? back : front) edges.push(pathOf(run.map((j) => high[j])));
  return {
    fill: fills.join(""),
    outline: edges.join(""),
    crease: capSeen ? front.map((run) => pathOf(run.map((j) => high[j]))).join("") : "",
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    seamless: true,
  };
}

function prismOf(F, polygon, s0, s1, P) {
  const V = viewOf(P);
  const L = lightOf(P);
  const ring = oriented(polygon.map(([x, y]) => [x, y]));
  const n = ring.length;
  const at = (s, [x, y]) => [F.o[0] + F.a[0] * s + F.u[0] * x + F.v[0] * y, F.o[1] + F.a[1] * s + F.u[1] * x + F.v[1] * y, F.o[2] + F.a[2] * s + F.u[2] * x + F.v[2] * y];
  const low = ring.map((point) => iso(at(s0, point), P));
  const high = ring.map((point) => iso(at(s1, point), P));
  const buckets = [[], [], [], [], []];
  const seen = [];
  for (let j = 0; j < n; j++) {
    const [x0, y0] = ring[j];
    const [x1, y1] = ring[(j + 1) % n];
    const normal = unit3(add3(mul3(F.u, y1 - y0), mul3(F.v, -(x1 - x0))));
    const visible = dot3(normal, V) > 1e-6;
    seen.push(visible);
    if (visible) buckets[bandOf(dot3(normal, L))].push(pathOf([low[j], low[(j + 1) % n], high[(j + 1) % n], high[j]], true));
  }
  const ends = [[s0, low, mul3(F.a, -1)], [s1, high, F.a]];
  const capSeen = ends.map(([, , normal]) => dot3(normal, V) > 1e-6);
  ends.forEach(([, points, normal], index) => capSeen[index] && buckets[bandOf(dot3(normal, L))].push(pathOf(points, true)));
  const hull = hullOf([...low, ...high]);
  const creases = [];
  for (let j = 0; j < n; j++) {
    const prev = (j - 1 + n) % n;
    const a = [ring[j][0] - ring[prev][0], ring[j][1] - ring[prev][1]];
    const b = [ring[(j + 1) % n][0] - ring[j][0], ring[(j + 1) % n][1] - ring[j][1]];
    const sharp = (a[0] * b[0] + a[1] * b[1]) / (Math.hypot(a[0], a[1]) * Math.hypot(b[0], b[1]) || 1) < Math.cos(0.35);
    if (sharp && seen[j] && seen[prev]) creases.push(pathOf([low[j], high[j]]));
    ends.forEach(([, points], index) => capSeen[index] && seen[j] && creases.push(pathOf([points[j], points[(j + 1) % n]])));
  }
  return { fill: pathOf(hull, true), outline: pathOf(hull, true), crease: creases.join(""), top: buckets[4].join(""), shades: buckets.slice(0, 4).map((list) => list.join("")) };
}

function stadium(r0, r1, offset, steps = 32) {
  const circle = (cx, r) => Array.from({ length: steps }, (_, index) => [cx + r * Math.cos((index / steps) * TAU), r * Math.sin((index / steps) * TAU)]);
  return hullOf([...circle(0, r0), ...circle(offset, r1)]);
}

function sphereOf(centre, r, P, { steps = 48 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const F = frameAlong(centre, V);
  const flat = (p) => iso(p, P);
  const rim = Array.from({ length: steps }, (_, index) => pointOf(F, 0, r, (index / steps) * TAU));
  const outline = pathOf(rim.map(flat), true);
  const capOf = (threshold) => {
    const points = rim.filter((p) => dot3(sub3(p, centre), L) / r >= threshold).map(flat);
    const c = dot3(L, V);
    const LF = frameAlong(add3(centre, mul3(L, r * threshold)), L);
    const radius = r * Math.sqrt(Math.max(0, 1 - threshold * threshold));
    for (let index = 0; index < steps; index++) {
      const p = pointOf(LF, 0, radius, (index / steps) * TAU);
      if (dot3(sub3(p, centre), V) >= -1e-9) points.push(flat(p));
    }
    if (c > threshold) points.push(flat(add3(centre, mul3(V, r))));
    return points.length > 2 ? pathOf(hullOf(points), true) : "";
  };
  const shades = [outline, capOf(BANDS[1]), capOf(BANDS[2]), capOf(BANDS[3])];
  return { fill: outline, outline, crease: "", top: "", shades, seamless: true };
}

const disc = (s0, s1, r, F, P, options = {}) =>
  lathe(
    [
      [s0, 0],
      [s0, r],
      [s1, r],
      [s1, 0],
    ],
    F,
    P,
    { steps: stepsFor(r, 32, 160, scaleOf(P)), ...options },
  );

const ringBand = (s0, s1, rIn, rOut, F, P, options = {}) =>
  lathe(
    [
      [s0, rIn],
      [s0, rOut],
      [s1, rOut],
      [s1, rIn],
    ],
    F,
    P,
    { steps: stepsFor(rOut, 32, 160, scaleOf(P)), hole: null, ...options },
  );

function solidOf(profile, F, P, options = {}) {
  const first = profile[0];
  const last = profile[profile.length - 1];
  const meridian = [[first[0], 0], ...profile, [last[0], 0]];
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(meridian, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function bandOfProfile(profile, F, P, options = {}) {
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(profile, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function silhouettePoints(profile, F, P, { samples = 72, slope: given = null, radius = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const facing = Math.atan2(vV, uV);
  const flat = Math.hypot(uV, vV) || 1e-9;
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const radiusAt = radius ?? ((s) => {
    let index = 1;
    while (index < profile.length - 1 && profile[index][0] < s) index++;
    const [sa, ra] = profile[index - 1];
    const [sb, rb] = profile[index];
    return ra + ((rb - ra) * (s - sa)) / (sb - sa || 1);
  });
  const side = (sign) => {
    const points = [];
    for (let step = 0; step <= samples; step++) {
      const s = s0 + ((s1 - s0) * step) / samples;
      const h = (s1 - s0) / samples / 2 || 0.01;
      const slope = given ? given(s) : (radiusAt(Math.min(s1, s + h)) - radiusAt(Math.max(s0, s - h))) / (Math.min(s1, s + h) - Math.max(s0, s - h) || 1);
      const c = (slope * aV) / flat;
      if (Math.abs(c) > 1) continue;
      points.push(pointOf(F, s, radiusAt(s), facing + sign * Math.acos(c)));
    }
    return points;
  };
  return [side(1), side(-1)];
}

const silhouetteOf = (profile, F, P, options = {}) =>
  silhouettePoints(profile, F, P, options)
    .map((points) => pathOf(points.map((point) => iso(point, P))))
    .join("");

function profileCurve(profile, { slope = null, radius = null } = {}) {
  for (let index = 1; index < profile.length; index++) if (profile[index][0] - profile[index - 1][0] <= 1e-9) throw new Error(`profileCurve: s must rise along the profile (point ${index} at s = ${profile[index][0]})`);
  const segments = curveRuns(profile);
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const find = (s) => {
    let lo = 0;
    let hi = profile.length - 2;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (profile[mid][0] <= s) lo = mid;
      else hi = mid - 1;
    }
    return lo;
  };
  const linear = (index, s) => {
    const [sa, ra] = profile[index];
    const [sb, rb] = profile[index + 1];
    return [ra + ((rb - ra) * (s - sa)) / (sb - sa), (rb - ra) / (sb - sa)];
  };
  const radiusAt = radius ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].radius(at) : linear(index, at)[0];
  });
  const slopeAt = slope ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].slope(at) : linear(index, at)[1];
  });
  return { s0, s1, radius: radiusAt, slope: slopeAt, analytic: Boolean(slope && radius) };
}

function bandsOf(profile, cuts, F, P, { slope = null, radius = null, steps, rows = 6, rims = "none", fill = "auto", samples = 72 } = {}) {
  const curve = profileCurve(profile, { slope, radius });
  const { s0, s1 } = curve;
  const stops = [s0, ...[...new Set(cuts)].filter((s) => s > s0 + 1e-6 && s < s1 - 1e-6).sort((a, b) => a - b), s1];
  const most = Math.max(...profile.map(([, r]) => r), ...stops.map((s) => curve.radius(s)));
  const n = steps ?? stepsFor(most, 32, 160, scaleOf(P));
  const knot = (s, soft) => (soft ? [s, curve.radius(s), 1] : [s, curve.radius(s)]);
  const meridianOf = (a, b) => [knot(a), ...profile.filter(([s]) => s > a + 1e-9 && s < b - 1e-9).map(([s, , soft]) => knot(s, soft)), knot(b)];
  const shading = { slope: curve.slope, radius: curve.radius, rows };
  const bands = stops.slice(0, -1).map((a, index) => {
    const b = stops[index + 1];
    const meridian = meridianOf(a, b);
    const paths = lathe(meridian, F, P, { steps: n, rims, fill, smooth: shading });
    const seam = index < stops.length - 2 ? arcOf(F, b, curve.radius(b), P, { slope: curve.slope(b) }) : "";
    return { s0: a, s1: b, profile: meridian, paths: { ...paths, outline: "" }, outline: paths.outline, seam };
  });
  const sidesOf = (from = s0, to = s1, { ends = false, count = samples } = {}) => {
    const span = [Math.max(s0, from), Math.min(s1, to)];
    const dense = Array.from({ length: count + 1 }, (_, index) => knot(span[0] + ((span[1] - span[0]) * index) / count, true));
    const points = silhouettePoints(dense, F, P, { samples: count, slope: curve.slope, radius: curve.radius });
    const rim = (s) => arcOf(F, s, curve.radius(s), P, { slope: curve.slope(s) });
    const rimsAt = ends === true ? span : ends === "first" ? [span[0]] : ends === "last" ? [span[1]] : [];
    return { d: points.map((list) => pathOf(list.map((point) => iso(point, P)))).join("") + rimsAt.map(rim).join(""), points };
  };
  return { bands, sidesOf, radius: curve.radius, slope: curve.slope, steps: n, s0, s1 };
}

function arcOf(F, s, r, P, { slope = 0, steps = 0, least = 0.02, inward = false, from = 0, to = TAU, trim = 0.3 } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const flat = Math.hypot(uV, vV);
  const phi = Math.atan2(vV, uV);
  const norm = Math.hypot(1, slope);
  const full = Math.abs(to - from - TAU) < 1e-9;
  let visible;
  if (flat < 1e-9) visible = (inward ? slope * aV / norm > least : -slope * aV / norm > least) ? [[phi, phi + TAU]] : [];
  else if (inward) {
    const c = (slope * aV - least * norm) / flat;
    visible = c <= -1 ? [] : c >= 1 ? [[phi, phi + TAU]] : [[phi + Math.acos(c), phi + TAU - Math.acos(c)]];
  } else {
    const c = (least * norm + slope * aV) / flat;
    visible = c >= 1 ? [] : c <= -1 ? [[phi, phi + TAU]] : [[phi - Math.acos(c), phi + Math.acos(c)]];
  }
  const at = (t) => iso(pointOf(F, s, r, t), P);
  const speed = (t) => {
    const a = at(t - 1e-3);
    const b = at(t + 1e-3);
    return Math.hypot(b[0] - a[0], b[1] - a[1]) / 2e-3;
  };
  const count = (span) => Math.max(2, Math.ceil(((steps || stepsFor(r, 24, 112)) * span) / TAU), Math.ceil((span * r * scaleOf(P)) / 1.5));
  const out = [];
  for (const [a, b] of visible) {
    if (b - a >= TAU - 1e-9 && full) {
      const n = count(TAU);
      out.push(pathOf(Array.from({ length: n }, (_, j) => at(from + (j / n) * TAU)), true));
      continue;
    }
    const pieces = full ? [[a, b, true, true]] : [];
    if (!full)
      for (let turn = -2; turn <= 2; turn++) {
        const lo = Math.max(a + turn * TAU, from);
        const hi = Math.min(b + turn * TAU, to);
        if (hi - lo > 1e-6) pieces.push([lo, hi, lo > from + 1e-9, hi < to - 1e-9]);
      }
    for (const [lo, hi, limb0, limb1] of pieces) {
      const span = hi - lo;
      const cut0 = limb0 && trim > 0 ? Math.min(span * 0.25, trim / (speed(lo) || 1)) : 0;
      const cut1 = limb1 && trim > 0 ? Math.min(span * 0.25, trim / (speed(hi) || 1)) : 0;
      const t0 = lo + cut0;
      const t1 = hi - cut1;
      const n = count(t1 - t0);
      out.push(pathOf(Array.from({ length: n + 1 }, (_, j) => at(t0 + ((t1 - t0) * j) / n))));
    }
  }
  return out.join("");
}

function circleOf(F, s, r, P, steps = 0) {
  const count = steps || stepsFor(r, 24, 112);
  return pathOf(
    Array.from({ length: count }, (_, j) => iso(pointOf(F, s, r, (j / count) * TAU), P)),
    true,
  );
}

function spokesOf(F, s, r0, r1, count, P, { phase = 0, sweep = 0, from = 0, to = TAU } = {}) {
  const lines = [];
  for (let index = 0; index < count; index++) {
    const t = phase + from + (index / count) * (to - from);
    lines.push(pathOf([iso(pointOf(F, s, r0, t), P), iso(pointOf(F, s, r1, t + sweep), P)]));
  }
  return lines.join("");
}

const fadeOf = (value, [lo, hi]) => {
  const t = Math.max(0, Math.min(1, (value - lo) / (hi - lo || 1e-9)));
  return t * t * (3 - 2 * t);
};

function ribsOf(F, s0, s1, r, count, P, { phase = 0, twist = 0, least = 0.12, r1 = r, fade = null, seams = false } = {}) {
  const V = viewOf(P);
  const lines = [];
  const slope = (r1 - r) / (s1 - s0 || 1);
  for (let index = 0; index < count; index++) {
    const t = phase + (index / count) * TAU;
    const radial = radialOf(F, t + twist / 2);
    const normal = unit3([radial[0] - slope * F.a[0], radial[1] - slope * F.a[1], radial[2] - slope * F.a[2]]);
    const facing = dot3(normal, V);
    const d = pathOf([iso(pointOf(F, s0, r, t), P), iso(pointOf(F, s1, r1, t + twist), P)]);
    if (fade) {
      const alpha = fadeOf(facing, fade);
      if (alpha > 0.02) lines.push({ d, alpha });
      continue;
    }
    if (facing < least) continue;
    lines.push(d);
  }
  const ends = seams ? [seams === "last" ? "" : arcOf(F, s0, r, P, { slope }), seams === "first" ? "" : arcOf(F, s1, r1, P, { slope })].filter(Boolean) : [];
  if (fade) return [...lines, ...ends.map((d) => ({ d, alpha: 1 }))];
  return [...lines, ...ends].join("");
}

function rodOut(F, from, to, r, P, { stroke = 0, ...options } = {}) {
  const pad = 0.35 / scaleOf(P);
  const ring = (s) => Array.from({ length: 48 }, (_, index) => iso(pointOf(F, s, r + pad, (index / 48) * TAU), P));
  return {
    paths: disc(from - stroke, to, r, F, P, options),
    clip: pathOf(hullOf([...ring(from), ...ring(to + stroke)]), true),
    from,
    to,
    stroke,
    reach: to + stroke,
  };
}

function dotsOf(F, s, r, count, P, { phase = 0, slope = 0, least = 0.08, all = false, fade = null } = {}) {
  const V = viewOf(P);
  const out = [];
  for (let index = 0; index < count; index++) {
    const t = phase + (index / count) * TAU;
    let alpha = 1;
    if (!all) {
      const radial = radialOf(F, t);
      const normal = unit3([radial[0] - slope * F.a[0], radial[1] - slope * F.a[1], radial[2] - slope * F.a[2]]);
      const facing = dot3(normal, V);
      if (fade) alpha = fadeOf(facing, fade);
      else if (facing < least) continue;
      if (alpha <= 0.02) continue;
    }
    const [x, y] = iso(pointOf(F, s, r, t), P);
    out.push(alpha < 1 ? [x, y, alpha] : [x, y]);
  }
  return out;
}

function facingOf(F, angle, P, slope = 0) {
  const radial = radialOf(F, angle);
  return dot3(unit3([radial[0] - slope * F.a[0], radial[1] - slope * F.a[1], radial[2] - slope * F.a[2]]), viewOf(P));
}

function fillet(points, radius, perArc = 7, { P = null, tube = 0, margin = 1.3 } = {}) {
  if (points.length < 3) return points.map((p) => [...p]);
  const V = P && tube ? viewOf(P) : null;
  const out = [[...points[0]]];
  for (let index = 1; index < points.length - 1; index++) {
    const prev = points[index - 1];
    const here = points[index];
    const next = points[index + 1];
    const into = unit3(sub3(here, prev));
    const outOf = unit3(sub3(next, here));
    const cosTurn = Math.max(-1, Math.min(1, dot3(into, outOf)));
    const turn = Math.acos(cosTurn);
    if (turn < 1e-3) {
      out.push([...here]);
      continue;
    }
    const room = Math.min(len3(sub3(here, prev)), len3(sub3(next, here))) * 0.48;
    const facing = V ? Math.abs(dot3(unit3(cross3(into, outOf)), V)) : 1;
    const bend = V ? Math.max(radius, (margin * tube) / (0.7 * Math.max(0.05, facing) ** 2)) : radius;
    const cut = Math.min(bend * Math.tan(turn / 2), room);
    const a = sub3(here, mul3(into, cut));
    const b = add3(here, mul3(outOf, cut));
    const count = Math.max(2, Math.ceil((perArc * turn) / (Math.PI / 2)));
    for (let step = 0; step <= count; step++) {
      const t = step / count;
      const p0 = lerp3(a, here, t);
      const p1 = lerp3(here, b, t);
      out.push(lerp3(p0, p1, t));
    }
  }
  out.push([...points[points.length - 1]]);
  return out;
}

function resample(points, spacing) {
  const lengths = [0];
  for (let index = 1; index < points.length; index++) lengths.push(lengths[index - 1] + len3(sub3(points[index], points[index - 1])));
  const total = lengths[lengths.length - 1];
  const count = Math.max(1, Math.round(total / spacing));
  const out = [];
  let segment = 1;
  for (let step = 0; step <= count; step++) {
    const at = (total * step) / count;
    while (segment < points.length - 1 && lengths[segment] < at) segment++;
    const a = points[segment - 1];
    const b = points[segment];
    const span = lengths[segment] - lengths[segment - 1] || 1;
    out.push(lerp3(a, b, Math.min(1, Math.max(0, (at - lengths[segment - 1]) / span))));
  }
  return out;
}

function pathLength(points) {
  let total = 0;
  for (let index = 1; index < points.length; index++) total += len3(sub3(points[index], points[index - 1]));
  return total;
}

function cut(points, from, to) {
  const out = [];
  let walked = 0;
  for (let index = 1; index < points.length; index++) {
    const a = points[index - 1];
    const b = points[index];
    const length = len3(sub3(b, a));
    const start = walked;
    const end = walked + length;
    if (end >= from && start <= to) {
      const t0 = Math.max(0, (from - start) / (length || 1));
      const t1 = Math.min(1, (to - start) / (length || 1));
      if (!out.length) out.push(lerp3(a, b, t0));
      out.push(lerp3(a, b, t1));
    }
    walked = end;
  }
  return out;
}

const pointAlong = (points, at) => {
  const piece = cut(points, at, at + 0.01);
  return piece[0] ?? points[points.length - 1];
};

function tangentAlong(points, at) {
  const total = pathLength(points);
  const a = pointAlong(points, Math.max(0, at - 0.6));
  const b = pointAlong(points, Math.min(total, at + 0.6));
  return unit3(sub3(b, a));
}

function spiral(F, s, r0, r1, a0, a1, steps = 28) {
  const out = [];
  for (let index = 0; index <= steps; index++) {
    const t = index / steps;
    out.push(pointOf(F, s, r0 + (r1 - r0) * t, a0 + (a1 - a0) * t));
  }
  return out;
}

function arcPoints(F, s, r, a0, a1, steps = 24) {
  return Array.from({ length: steps + 1 }, (_, index) => pointOf(F, s, r, a0 + ((a1 - a0) * index) / steps));
}

return (() => {
// The Staff Only crew. Each animal is a painted illustration on a 2D rig: authored shapes facing left,
// standing on y = 0 and about 100 units tall, filled with soft gradients, fur at the edges and strands
// inside, no outlines. critter(spec, pose, P) places one in the figure's camera: it faces left or right
// by its heading, shows its back when it walks away, leans, hops, looks up and down, and reaches its paws
// to points in the world. critterSvg draws it at build time and paintCritter updates it each frame.


const TAU = Math.PI * 2;

// ---------- an ellipsoid for machine parts (eggs, domes, piles), in kit solid form
const BANDS = [0, 0.2, 0.42, 0.62];

function ellipsoidOf(centre, [a, b, c], P, { steps = 32, clip = null, bands = null, shade0 = true } = {}) {
  const bc = cross3(b, c), ca = cross3(c, a), ab = cross3(a, b);
  const det = dot3(a, bc);
  const inv = (w) => [dot3(bc, w) / det, dot3(ca, w) / det, dot3(ab, w) / det];
  const Vu = unit3(inv(viewOf(P)));
  const Lu = unit3(inv(lightOf(P)));
  const map = (u) => iso(add3(centre, add3(add3(mul3(a, u[0]), mul3(b, u[1])), mul3(c, u[2]))), P);
  const circle = (axis, h) => {
    const F = frameAlong([0, 0, 0], axis), r = Math.sqrt(Math.max(0, 1 - h * h));
    return Array.from({ length: steps }, (_, i) => pointOf(F, h, r, (i / steps) * TAU));
  };
  let Nu = null, Hc = 0;
  if (clip) {
    const raw = [dot3(a, clip.n), dot3(b, clip.n), dot3(c, clip.n)];
    const k = len3(raw);
    Nu = mul3(raw, 1 / k);
    Hc = (clip.d ?? 0) / k;
  }
  const inside = (u) => !Nu || dot3(u, Nu) >= Hc - 1e-9;
  const rim = circle(Vu, 0);
  const cut = Nu ? circle(Nu, Hc) : [];
  const outline = pathOf(hullOf([...rim.filter(inside), ...cut].map(map)), true);
  const capOf = (t) => {
    if (t == null || t >= 1) return "";
    if (t <= -1) return outline;
    const pts = rim.filter((u) => dot3(u, Lu) >= t && inside(u));
    for (const u of circle(Lu, t)) if (dot3(u, Vu) >= -1e-9 && inside(u)) pts.push(u);
    for (const u of cut) if (dot3(u, Vu) >= -1e-9 && dot3(u, Lu) >= t) pts.push(u);
    if (dot3(Vu, Lu) > t && inside(Vu)) pts.push(Vu);
    return pts.length > 2 ? pathOf(hullOf(pts.map(map)), true) : "";
  };
  const bs = bands ?? BANDS.slice(1);
  return { fill: outline, outline, crease: "", top: "", shades: [shade0 ? outline : "", capOf(bs[0]), capOf(bs[1]), capOf(bs[2])], seamless: true };
}

// ---------- drawing
const RAD = Math.PI / 180;
const n1 = (v) => { const r = Math.round(v * 10) / 10; return Object.is(r, -0) ? "0" : String(r); };
const pt = (p) => `${n1(p[0])},${n1(p[1])}`;
const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
const add = (a, b, t = 1) => [a[0] + b[0] * t, a[1] + b[1] * t];
const len = (a) => Math.hypot(a[0], a[1]);
const unit = (a) => { const l = len(a) || 1; return [a[0] / l, a[1] / l]; };
const rotp = ([x, y], a, [cx, cy] = [0, 0]) => { const c = Math.cos(a), s = Math.sin(a), dx = x - cx, dy = y - cy; return [cx + dx * c - dy * s, cy + dx * s + dy * c]; };

function rng(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s + 0x6d2b79f5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// A smooth curve through points (Catmull-Rom as cubic Béziers). A third element marks a corner.
function curve(pts, closed = true, steps = 8) {
  const n = pts.length;
  const at = (i) => pts[closed ? ((i % n) + n) % n : Math.max(0, Math.min(n - 1, i))];
  const segs = [];
  for (let i = 0; i < (closed ? n : n - 1); i++) {
    const p0 = at(i - 1), p1 = at(i), p2 = at(i + 1), p3 = at(i + 2);
    const c1 = p1[2] ? p1 : [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = p2[2] ? p2 : [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    segs.push([p1, c1, c2, p2]);
  }
  const d = `M${pt(pts[0])}` + segs.map((s) => `C${pt(s[1])} ${pt(s[2])} ${pt(s[3])}`).join("") + (closed ? "Z" : "");
  const poly = [];
  for (const [a, b, c, e] of segs) {
    for (let j = 0; j < steps; j++) {
      const t = j / steps, u = 1 - t;
      poly.push([u * u * u * a[0] + 3 * u * u * t * b[0] + 3 * u * t * t * c[0] + t * t * t * e[0], u * u * u * a[1] + 3 * u * u * t * b[1] + 3 * u * t * t * c[1] + t * t * t * e[1]]);
    }
  }
  if (!closed) poly.push(pts[n - 1]);
  return { d, poly };
}

const area = (poly) => { let s = 0; for (let i = 0; i < poly.length; i++) { const a = poly[i], b = poly[(i + 1) % poly.length]; s += a[0] * b[1] - b[0] * a[1]; } return s / 2; };
function inside(poly, x, y) {
  let c = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if (yi > y !== yj > y && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) c = !c;
  }
  return c;
}
const bounds = (poly) => poly.reduce((b, [x, y]) => [Math.min(b[0], x), Math.min(b[1], y), Math.max(b[2], x), Math.max(b[3], y)], [1e9, 1e9, -1e9, -1e9]);

function resample(poly, gap, closed = true) {
  const out = [];
  let carry = 0;
  const n = poly.length;
  for (let i = 0; i < (closed ? n : n - 1); i++) {
    const a = poly[i], b = poly[(i + 1) % n];
    const l = len(sub(b, a));
    let t = carry;
    while (t < l) { out.push(add(a, sub(b, a), t / l)); t += gap; }
    carry = t - l;
  }
  return out;
}

// Fur along an edge: short strokes that start just inside and lean with the coat's flow.
// Returns three paths split by how the edge faces the light.
function tufts(poly, { len: L = 2, gap = 1.5, flow = [0.35, 1], lean = 0.55, seed = 1, light = [-0.6, -0.8], only = null }) {
  const r = rng(seed);
  const sgn = area(poly) > 0 ? 1 : -1;
  const pts = resample(poly, gap);
  const out = { lit: "", mid: "", shade: "" };
  const fl = unit(flow);
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i], q = pts[(i + 1) % pts.length], o = pts[(i - 1 + pts.length) % pts.length];
    const t = unit(sub(q, o));
    const nrm = [t[1] * sgn, -t[0] * sgn];
    if (only && !only(p, nrm)) continue;
    const l = L * (0.65 + 0.7 * r());
    const dir = unit(add(nrm, fl, lean));
    const b = add(p, nrm, -l * 0.55);
    const tip = add(b, dir, l * 1.25);
    const c = add(add(b, dir, l * 0.6), [-dir[1], dir[0]], (r() - 0.5) * l * 0.5);
    const lit = nrm[0] * light[0] + nrm[1] * light[1];
    const key = lit > 0.3 ? "lit" : lit < -0.35 ? "shade" : "mid";
    out[key] += `M${pt(b)}Q${pt(c)} ${pt(tip)}`;
  }
  return out;
}

// Hair strands inside a shape, along the coat's flow.
function strands(poly, { count = 60, len: L = 4, flow = [0.35, 1], seed = 7, light = [-0.6, -0.8] }) {
  const r = rng(seed);
  const [x0, y0, x1, y1] = bounds(poly);
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, w = x1 - x0, h = y1 - y0;
  const fl = unit(flow);
  const out = { lit: "", shade: "" };
  let tries = 0, made = 0;
  while (made < count && tries < count * 8) {
    tries++;
    const x = x0 + r() * w, y = y0 + r() * h;
    if (!inside(poly, x, y)) continue;
    made++;
    const l = L * (0.6 + 0.8 * r());
    const bend = (r() - 0.5) * 0.6;
    const d = unit(add(fl, [-fl[1], fl[0]], bend));
    const a = [x, y], b = add(a, d, l), c = add(add(a, d, l * 0.5), [-d[1], d[0]], bend * l * 0.4);
    const side = ((x - cx) / w) * light[0] + ((y - cy) / h) * light[1];
    out[side > 0.12 && r() < 0.8 ? "lit" : "shade"] += `M${pt(a)}Q${pt(c)} ${pt(b)}`;
  }
  return out;
}

// A limb outline around a centreline with a width at each point; round at both ends.
function limb(cl, ws) {
  const left = [], right = [];
  for (let i = 0; i < cl.length; i++) {
    const t = unit(sub(cl[Math.min(cl.length - 1, i + 1)], cl[Math.max(0, i - 1)]));
    const nrm = [-t[1], t[0]];
    left.push(add(cl[i], nrm, ws[i] / 2));
    right.push(add(cl[i], nrm, -ws[i] / 2));
  }
  const t0 = unit(sub(cl[1], cl[0])), t1 = unit(sub(cl[cl.length - 1], cl[cl.length - 2]));
  const tip = add(cl[cl.length - 1], t1, ws[ws.length - 1] * 0.45);
  const root = add(cl[0], t0, -ws[0] * 0.45);
  return [root, ...left, tip, ...right.reverse()];
}

// Two-bone reach: shoulder to target, elbow bent toward `bend`.
function reach2(S, T, l1, l2, bend = [0.4, 1]) {
  let d = sub(T, S);
  let dist = len(d);
  const max = l1 + l2 - 0.01, min = Math.abs(l1 - l2) + 0.5;
  const short = Math.max(0, dist - (l1 + l2));
  if (dist > max) { d = unit(d); T = add(S, d, max); dist = max; }
  if (dist < min) { d = unit(d); T = add(S, d, min); dist = min; }
  const phi = Math.atan2(T[1] - S[1], T[0] - S[0]);
  const a = Math.acos(Math.max(-1, Math.min(1, (l1 * l1 + dist * dist - l2 * l2) / (2 * l1 * dist))));
  const e1 = [S[0] + l1 * Math.cos(phi + a), S[1] + l1 * Math.sin(phi + a)];
  const e2 = [S[0] + l1 * Math.cos(phi - a), S[1] + l1 * Math.sin(phi - a)];
  const score = (e) => (e[0] - S[0]) * bend[0] + (e[1] - S[1]) * bend[1];
  return { E: score(e1) >= score(e2) ? e1 : e2, W: T, short };
}

const hexToHsl = (hex) => {

  const hi = Math.max(r, g, b), lo = Math.min(r, g, b), l = (hi + lo) / 2;

function subjectCss(sel, light, dark = light) {

    const base = darkTheme ? 0.82 : 1;
    return `--anatomy-paper:${L(base)};--anatomy-face:${L(base * 1.06)};--anatomy-top:${L(base * 1.12)};--anatomy-shade-0:${L(base * 0.72)};--anatomy-shade-1:${L(base * 0.8)};--anatomy-shade-2:${L(base * 0.88)};--anatomy-shade-3:${L(base * 0.95)};--anatomy-lit-top:${L(base * 1.16)};--anatomy-lit-shade:${L(base * 0.98)}`;

    s += furShape(sp, ears.near.pts, ears.near.tone ?? "fur", { strands: 0, tuft: ears.near.tuft ?? 1.1, gap: 1.6, seed: 23, flow: ears.near.flow }, mirror);
    if (ears.near.inner) s += softShape(sp, ears.near.inner, ears.near.innerTone ?? "skin", front ? 0.95 : 0.4);
    s += brushSvg(ears.near.brush);
  }
  if (H.teeth) s += `<path d="${H.teeth}" style="fill:var(--so-teeth)"/><path d="${H.teeth}" fill="url(#so-${sp}-v-skin)" opacity=".18"/>${H.teethLine ? `<path class="so-line" d="${H.teethLine}" style="stroke:var(--so-fur-shade);stroke-width:.4"/>` : ""}`;
  if (front) s += whiskersSvg(H.whiskers);
  s += headProps(sp, H, wear, front);
  return s;
}

function pawSvg(sp, P) {
  // A paw along +x from the wrist.
  const l = P.len, w = P.w;
  if (P.pincer) {
    // A crab's claw: a swollen palm, a fixed finger below and a movable one above, dark tips.
    const palm = [[-0.5, -w * 0.4], [l * 0.3, -w * 0.55], [l * 0.58, -w * 0.45], [l * 0.66, 0], [l * 0.58, w * 0.45], [l * 0.3, w * 0.55], [-0.5, w * 0.4]];
    const lower = [[l * 0.5, w * 0.06], [l * 0.82, w * 0.1], [l * 1.04, -w * 0.02, 1], [l * 0.86, w * 0.3], [l * 0.55, w * 0.4]];
    const upper = [[l * 0.5, -w * 0.08], [l * 0.82, -w * 0.26], [l * 1.08, -w * 0.12, 1], [l * 0.8, -w * 0.42], [l * 0.5, -w * 0.44]];
    const tip = (x, y) => `<ellipse cx="${n1(x)}" cy="${n1(y)}" rx="${n1(l * 0.09)}" ry="${n1(w * 0.09)}" fill="url(#so-${sp}-s-skin)"/>`;
    return `<path d="${curve(upper).d}" fill="url(#so-${sp}-v-${P.tone ?? "fur"})"/><path d="${curve(lower).d}" fill="url(#so-${sp}-v-${P.tone ?? "fur"})"/>${tip(l * 1.0, -w * 0.14)}${tip(l * 0.98, 0)}<path d="${curve(palm).d}" fill="url(#so-${sp}-v-${P.tone ?? "fur"})"/><ellipse cx="${n1(l * 0.28)}" cy="${n1(-w * 0.2)}" rx="${n1(l * 0.16)}" ry="${n1(w * 0.12)}" fill="#fff" opacity=".2"/>`;
  }
  const pts = [[-0.5, -w * 0.42], [l * 0.45, -w * 0.55], [l * 0.9, -w * 0.38], [l * 1.04, 0], [l * 0.9, w * 0.38], [l * 0.45, w * 0.55], [-0.5, w * 0.42]];
  let s = `<path d="${curve(pts).d}" fill="url(#so-${sp}-v-${P.tone ?? "skin"})"/>`;
  const toes = P.toes ?? 4;
  let d = "";
  for (let i = 1; i < toes; i++) {
    const y = -w * 0.5 + (w * i) / toes;
    d += `M${n1(l * 0.68)},${n1(y * 0.9)}L${n1(l * 1.0)},${n1(y * 0.75)}`;
  }
  s += `<path class="so-line" d="${d}" style="stroke:var(--so-${P.tone ?? "skin"}-shade);stroke-width:${n1(w * 0.07)};opacity:.7"/>`;

}

function footSvg(sp, F) {
  let s = `<path d="${curve(F.pts).d}" fill="url(#so-${sp}-v-${F.tone ?? "skin"})"/>`;
  if (F.claws) s += `<path class="so-line" d="${F.claws}" style="stroke:var(--so-claw);stroke-width:${F.clawW ?? 0.5}"/>`;
  if (F.toes) s += `<path class="so-line" d="${F.toes}" style="stroke:var(--so-${F.tone ?? "skin"}-shade);stroke-width:.35;opacity:.7"/>`;
  return s;
}

const collarSvg = (C) => (C ? `<path class="so-line" d="${C.d}" style="stroke:var(--so-role-dark);stroke-width:${n1(C.w + 0.8)}"/><path class="so-line" d="${C.d}" style="stroke:var(--so-role);stroke-width:${n1(C.w)}"/>${C.tag ? `<circle cx="${n1(C.tag[0])}" cy="${n1(C.tag[1])}" r="${n1(C.tag[2])}" style="fill:var(--so-role-dark)"/><circle cx="${n1(C.tag[0] - C.tag[2] * 0.15)}" cy="${n1(C.tag[1] - C.tag[2] * 0.15)}" r="${n1(C.tag[2] * 0.72)}" style="fill:var(--so-role)"/><circle cx="${n1(C.tag[0] - C.tag[2] * 0.35)}" cy="${n1(C.tag[1] - C.tag[2] * 0.35)}" r="${n1(C.tag[2] * 0.22)}" fill="#fff" opacity=".7"/>` : ""}` : "");

// ---------- static pieces, cached by species, stance, view and mirror
const CACHE = new Map();
function pieces(sp, stance, front, mirror, eyes, role, wear, spread = false) {
  const key = `${sp}|${stance}|${front}|${mirror}|${eyes}|${role}|${wear.join(",")}|${spread}`;
  if (CACHE.has(key)) return CACHE.get(key);
  const a = ART[sp], R = stance === "four" ? a.four : a.up;
  const out = { defs: defs(sp) };
  const B = R.body;
  const legs = (list) => (list ?? []).map((L) => plainShape(sp, limb(L.cl, L.w), L.tone ?? "fur")).join("");
  out.body = legs(B.under) + furShape(sp, B.pts, B.tone ?? "fur", { strands: B.strands ?? 60, flow: B.flow, seed: 4, only: B.tuftOnly, lean: B.lean }, mirror);
  for (const m of B.marks ?? []) if (front || !m.front) out.body += m.soft === false ? plainShape(sp, m.pts, m.tone) : softShape(sp, m.pts, m.tone, m.op ?? 1);
  if (!front) for (const m of B.backMarks ?? []) out.body += softShape(sp, m.pts, m.tone, m.op ?? 1);
  for (const o of B.ao ?? []) out.body += aoBlob(sp, o, 0.8);
  out.body += legs(B.over);
  out.collar = collarSvg(R.collar);
  out.head = headSvg(sp, R.head, { eyes, front, mirror, wear, role });
  out.tail = R.tail ? tailSvg(sp, R.tail, mirror) : "";
  if (R.wing) {
    // Folded on the body, or spread up and back in flight.
    const Wg = spread && R.wing.spread ? { ...R.wing, ...R.wing.spread } : R.wing;
    out.wingN = furShape(sp, Wg.pts, Wg.tone ?? "fur", { strands: 0, tuft: 0.8, gap: 1.2, seed: 41, flow: [1, 0.4] }, mirror) + (Wg.marks ?? []).map((m) => (m.soft === false ? plainShape(sp, m.pts, m.tone) : softShape(sp, m.pts, m.tone, m.op ?? 1))).join("") + (Wg.lines ? `<path class="so-line" d="${Wg.lines}" style="stroke:var(--so-${Wg.tone ?? "fur"}-shade);stroke-width:.4;opacity:.6"/>` : "");
    out.wingF = plainShape(sp, Wg.pts, Wg.tone === "belly" ? "fur" : "dark");
  }
  out.ground = `<ellipse cx="${n1(R.shadow[0])}" cy="1" rx="${n1(R.shadow[1])}" ry="${n1(R.shadow[2])}" fill="url(#so-${sp}-ground)"/>`;
  if (R.arms) out.pawN = out.pawF = pawSvg(sp, R.arms.paw);
  if (R.feet) { out.footN = footSvg(sp, R.feet.near); out.footF = footSvg(sp, R.feet.far ?? R.feet.near); }
  if (R.legs) out.legFoot = R.legs.map((L) => footSvg(sp, L.foot));
  CACHE.set(key, out);
  return out;
}

const tr = (x, y) => `translate(${n1(x)} ${n1(y)})`;

// ---------- the eel: a body along a world path
const ramp = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
// A path when the pose gives none: straight along the heading through `at`, with a gentle wave.
function eelPath(pose, size) {
  const at = pose.at ?? [0, 0, 0];
  const h = (pose.heading ?? 0) * RAD, fw = [Math.cos(h), Math.sin(h)], side = [-fw[1], fw[0]];
  const ph = (pose.stride?.phase ?? 0) * TAU, amp = size * (0.035 + (pose.stride?.amount ?? 0) * 0.3);
  return Array.from({ length: 17 }, (_, i) => {
    const u = i / 16, wave = Math.sin(u * TAU * 1.2 + ph) * amp * ramp(0, 0.3, u);
    if (pose.stance === "hang") return [at[0] + fw[0] * wave, at[1] + fw[1] * wave, at[2] + size * (0.55 - u)];
    return [at[0] + fw[0] * size * (0.5 - u) + side[0] * wave, at[1] + fw[1] * size * (0.5 - u) + side[1] * wave, at[2]];
  });
}
// Distance along a world polyline to a point, carrying on past its end along the last segment.
function walker(path) {
  const d = [0];
  for (let i = 1; i < path.length; i++) d.push(d[i - 1] + Math.hypot(path[i][0] - path[i - 1][0], path[i][1] - path[i - 1][1], path[i][2] - path[i - 1][2]));
  return (s) => {
    let i = 1;
    while (i < path.length - 1 && d[i] < s) i++;
    const a = path[i - 1], b = path[i], t = (s - d[i - 1]) / (d[i] - d[i - 1] || 1);
    return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  };
}
const ribbon = (L, R) => `M${L.map(pt).join("L")}L${[...R].reverse().map(pt).join("L")}Z`;
function eelPieces(sp, mirror, eyes, role, wear) {
  const key = `${sp}|path|${mirror}|${eyes}|${role}|${wear.join(",")}`;
  if (CACHE.has(key)) return CACHE.get(key);
  const H = ART[sp].path.head;
  const out = { defs: defs(sp) };
  out.head = headSvg(sp, H, { eyes, front: true, mirror, wear, role }) + collarSvg(H.collar) + softShape(sp, H.pectoral, "dark", 0.85);
  CACHE.set(key, out);
  return out;
}
// pose: { path: world points from the snout back, at/heading when there is no path, eyes, charge 0..1,
// flicker (any number; each whole step redraws the sparks), target: a world point the snout arcs to }.
function eelCritter(spec, pose, P) {
  const sp = spec.species, A = ART[sp].path;
  const size = spec.size ?? 40;
  const path = pose.path?.length > 1 ? pose.path : eelPath(pose, size);
  const W = walker(path);
  const mid = W(size / 2);
  const zpx = Math.abs(iso([mid[0], mid[1], mid[2] + 1], P)[1] - iso(mid, P)[1]);
  const k = (size * zpx) / 100;
  const s0 = (A.head.len * size) / 100, N = 36;
  const p = [], n = [], hw = [], fin = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    p.push(iso(W(s0 + (size - s0) * t), P));
    const w = A.width * (t < 0.42 ? 1 - (0.1 * t) / 0.42 : 0.9 * (1 - ((t - 0.42) / 0.58) ** 1.5)) + 0.25;
    hw.push(w * k);
    fin.push(A.fin * k * ramp(0.1, 0.32, t) * (1 - 0.4 * ramp(0.9, 1, t)));
  }
  for (let i = 0; i <= N; i++) {
    const tg = unit(sub(p[Math.min(N, i + 1)], p[Math.max(0, i - 1)]));
    let nv = [tg[1], -tg[0]];
    if (i ? nv[0] * n[i - 1][0] + nv[1] * n[i - 1][1] < 0 : nv[1] > 0) nv = [-nv[0], -nv[1]];
    n.push(nv);
  }
  const at = (i, f) => add(p[i], n[i], hw[i] * f);
  const span = (a, b, f) => Array.from({ length: b - a + 1 }, (_, j) => at(a + j, f));
  const tip = add(p[N], unit(sub(p[N], p[N - 1])), hw[N] * 1.5);
  const outline = [...span(0, N, 1), [...tip, 1], ...span(0, N, -1).reverse()];
  const finEdge = (i) => add(p[i], n[i], -(hw[i] + fin[i]));
  const f0 = Math.round(N * 0.1);
  const dyn = {};
  dyn.body = curve(outline).d;
  dyn.shade = shd(dyn.body, 0, hw[0] * 0.6);
  dyn.under = ribbon(span(0, N, -0.15), span(0, N, -1));
  dyn.lit = ribbon(span(0, N - 4, 0.15), span(0, N - 4, 0.8));
  const b1 = Math.round(N * 0.45);
  dyn.belly = ribbon(span(0, b1, -0.98), Array.from({ length: b1 + 1 }, (_, j) => at(j, -(1 - 0.6 * (1 - j / b1)))));
  dyn.gloss = ribbon(span(0, Math.round(N * 0.8), 0.5), span(0, Math.round(N * 0.8), 0.62));
  dyn.fin = ribbon(Array.from({ length: N - f0 + 1 }, (_, j) => finEdge(f0 + j)).concat([tip]), span(f0, N, -0.9).concat([tip]));
  let rays = "";
  for (let i = f0 + 1; i < N; i += 2) rays += `M${pt(at(i, -0.95))}L${pt(finEdge(i))}`;
  dyn.rays = rays;
  // The head: drawn facing left with its neck at the origin, turned to point back along the first stretch of path.
  const snout = iso(W(0), P);
  let D = sub(snout, p[0]);
  D = len(D) > 1e-6 ? unit(D) : unit(sub(p[0], p[1]));
  const mirror = D[0] > 0;
  const rot = Math.atan2(D[1], D[0]) / RAD + (mirror ? 0 : 180);
  dyn.head = `${tr(p[0][0], p[0][1])} rotate(${n1(rot)}) scale(${n1(mirror ? -k * 100 : k * 100) / 100} ${n1(k * 100) / 100})`;
  // Charge: sparks off the body and a crackle down its middle, redrawn whenever `flicker` steps on.
  const charge = Math.max(0, Math.min(1, pose.charge ?? 0));
  let zap = "";
  if (charge > 0) {
    const r = rng(Math.floor(pose.flicker ?? 0) * 7919 + 13);
    for (let i = 1; i < N - 2; i += 3) {
      if (r() > charge * 0.85) continue;
      const side = r() < 0.5 ? 1 : -1;
      let q = at(i, side * 0.9);
      zap += `M${pt(q)}`;
      for (let j = 0; j < 3; j++) { q = add(add(q, n[i], side * hw[0] * (0.35 + r() * 0.3)), unit(sub(p[i + 1], p[i])), hw[0] * (r() - 0.5) * 0.8); zap += `L${pt(q)}`; }
    }
    zap += `M${pt(p[0])}` + p.slice(1, N - 2).map((q, i) => `L${pt(add(q, n[i + 1], hw[i + 1] * (r() - 0.5) * 0.7))}`).join("");
    if (pose.target) {
      const T = iso(pose.target, P);
      zap += `M${pt(snout)}`;
      for (let j = 1; j <= 3; j++) { const q = add(snout, sub(T, snout), j / 3); zap += `L${pt(j < 3 ? add(q, [r() - 0.5, r() - 0.5], hw[0] * 0.7) : q)}`; }
    }
    dyn.charge = dyn.body;
  } else dyn.charge = "";
  dyn.zap = zap;
  dyn.zapGlow = zap;
  const eyes = pose.eyes ?? "open";
  const wear = [].concat(spec.wear ?? []).filter((w) => PROPS[w]);
  const S = eelPieces(sp, mirror, eyes, spec.role, wear);
  const xs = outline.map((q) => q[0]).concat([snout[0] - hw[0] * 1.4, snout[0] + hw[0] * 1.4]);
  const ys = outline.map((q) => q[1]).concat([snout[1] - hw[0] * 2.4, snout[1] + hw[0] * 1.4]);
  return {
    name: spec.name ?? sp, species: sp, role: spec.role, size, stance: "path", hang: false, front: true, mirror, eyes,
    key: `${sp}|path|${mirror}|${eyes}`, S, dyn, reach: {}, depth: depthOf(mid, P), anchor: p[0],
    box: [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)], lines: { ray: k * 0.14, glow: Math.max(1, hw[0] * 0.55), core: Math.max(0.4, hw[0] * 0.17) },
  };
}

// ---------- the critter
function critter(spec, pose = {}, P) {
  const sp = spec.species;
  const a = ART[sp];
  if (!a) throw new Error(`no species ${sp}`);
  if (a.path) return eelCritter(spec, pose, P);
  const stance = pose.stance === "four" && a.four ? "four" : "up";
  const hang = pose.stance === "hang";
  const R = stance === "four" ? a.four : a.up;
  const size = spec.size ?? 20;
  const at = pose.at ?? [0, 0, 0];
  const hop = pose.hop ?? 0;
  const g0 = iso(at, P);
  const base = iso([at[0], at[1], at[2] + hop], P);
  const zpx = Math.abs(iso([at[0], at[1], at[2] + 1], P)[1] - g0[1]);
  const k = (size * zpx) / 100;
  const h = (pose.heading ?? 0) * RAD;
  const fw = [Math.cos(h), Math.sin(h), 0];
  const fs = sub(iso([at[0] + fw[0], at[1] + fw[1], at[2]], P), g0);
  const fl = len(fs) || 1;
  const mirror = fs[0] > 0;
  const front = fs[1] > -0.05 * fl;
  const turn = Math.min(1, 0.74 + (0.26 * Math.abs(fs[0])) / fl / 0.55);
  const sq = pose.squash ?? 0;
  const sx = (mirror ? -1 : 1) * k * turn * (1 + 0.1 * sq), sy = k * (1 - 0.26 * sq);
  const eyes = pose.eyes ?? "open";
  const wear = [].concat(spec.wear ?? []).filter((w) => PROPS[w]);
  const wingsOpen = Math.max(0, Math.min(1, pose.wings ?? 0));
  const spread = !!R.wing?.spread && wingsOpen >= 0.5;
  const S = pieces(sp, stance, front, mirror, eyes, spec.role, wear, spread);
  let lean = ((pose.lean ?? 0) + (R.lean ?? 0)) * RAD;
  const toLocal = (w) => { const s = iso(w, P); return [(s[0] - base[0]) / sx, (s[1] - base[1]) / sy]; };
  const L = (p) => rotp(p, -lean, R.pivot);
  const look = pose.look ?? [0, 0];
  let pitch = Math.max(-30, Math.min(34, look[1] * 0.75)) + (R.head.pitch ?? 0);
  const reach = {};
  let neckOff = [0, 0];
  if (pose.beak && R.head.beakTip) {
    // Lean the body a little, tip the head and stretch the neck until the beak tip lands on the target.
    // For each lean and tip the neck takes up what is left, up to its length; the search prefers a short
    // neck and a small lean, so a bird pecks with its neck and only leans into a long reach.
    const T = toLocal(pose.beak), maxNeck = R.neck?.max ?? 0;
    const fit = (ln, pc) => {
      const Tb = rotp(T, ln * RAD, R.pivot);
      const tip = rotp(R.head.beakTip, pc * RAD, R.head.pivot);
      let o = sub(Tb, tip);
      if (len(o) > maxNeck) o = [(o[0] * maxNeck) / len(o), (o[1] * maxNeck) / len(o)];
      const miss = len(sub(Tb, add(tip, o)));
      return [miss, miss * 6 + len(o) * 0.1 + Math.abs(ln) * 0.25 + Math.abs(pc) * 0.02, o];
    };
    let best = null;
    const scan = (a0, a1, da, b0, b1, db) => { for (let a = a0; a <= a1; a += da) for (let b = b0; b <= b1; b += db) { const f = fit(a, b); if (!best || f[1] < best.cost) best = { a, b, miss: f[0], cost: f[1], o: f[2] }; } };
    scan(-15, 55, 2.5, -30, 34, 4);
    scan(best.a - 2.5, best.a + 2.5, 0.5, Math.max(-30, best.b - 4), Math.min(34, best.b + 4), 0.5);
    lean = best.a * RAD;
    pitch = best.b;
    neckOff = best.o;
    reach.beak = (best.miss * size) / 100;
  }
  const dyn = {};
  dyn.root = `${tr(base[0], base[1])} scale(${Math.round(sx * 1000) / 1000} ${Math.round(sy * 1000) / 1000})`;
  dyn.ground = `${tr(g0[0], g0[1])} scale(${Math.round(sx * 1000) / 1000} ${Math.round(k * 1000) / 1000})`;
  dyn.lean = `rotate(${n1(-lean / RAD)} ${pt(R.pivot)})`;
  dyn.head = `${neckOff[0] || neckOff[1] ? `${tr(neckOff[0], neckOff[1])} ` : ""}rotate(${n1(pitch)} ${pt(R.head.pivot)})`;
  if (R.neck) {
    // The neck: from its base on the body to wherever the head has gone, hidden under both when it hasn't moved.
    const top = add(R.head.pivot, neckOff);
    dyn.neck = curve(limb([R.neck.base, add(R.neck.base, sub(top, R.neck.base), 0.5), top], [R.neck.w[0], (R.neck.w[0] + R.neck.w[1]) / 2, R.neck.w[1]])).d;
  }
  if (R.wing) {
    // Folded: the wing lifts a little off the back. Spread: it beats, from wings 0.5 (down) to 1 (up).
    const w = spread ? (wingsOpen - 0.75) * 50 : wingsOpen * 30;
    dyn.wingN = `rotate(${n1(-w)} ${pt(R.wing.pivot)})`;
    dyn.wingF = `rotate(${n1(-w - (spread ? 14 : 0))} ${pt(R.wing.pivot)})`;
  }
  const stride = pose.stride ?? { phase: 0, amount: 0 };
  const sway = (pose.tailSway ?? 0) * 12;
  if (R.tail) dyn.tail = `rotate(${n1(-lean / RAD + sway)} ${pt(R.tail.pivot ?? R.pivot)})`;

  if (stance === "up") {
    // Which side of the animal is nearer the viewer.
    const side = [-Math.sin(h), Math.cos(h), 0];
    const leftNear = depthOf([at[0] + side[0], at[1] + side[1], at[2]], P) >= depthOf(at, P);
    const nearKey = leftNear ? "l" : "r", farKey = leftNear ? "r" : "l";
    const A = R.arms ?? { near: [0, 0], far: [0, 0], skip: true };
    // The shoulders sit across the body: move them along the animal's real side axis as the camera sees it,
    // so a paw target to its left or right lands on the matching side of the drawing.

  () => S.coin.phase === "done" && S.pt >= 2.25,
